<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room V · Book a room</title>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("roomv-theme") || "violet";
      document.documentElement.dataset.mode = localStorage.getItem("roomv-mode") || "auto";
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400..900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand-mark">V</span>
      <span><span class="brand-name">Room V</span><br><span class="brand-sub">Find it. Book it. Study.</span></span>
    </a>

    <div class="search" id="search">
      <div class="search-field">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="Search a room: 107a, Atrium, Seminarraum…" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="search-list" aria-autocomplete="list" aria-label="Search a room">
        <kbd class="kbd">/</kbd>
      </div>
      <ul class="suggestions hidden" id="search-list" role="listbox"></ul>
    </div>

    <div class="top-actions">
      <button class="btn mine-btn" id="mine-btn" type="button">
        <svg class="icon"><use href="#i-cal"/></svg><span class="label">My bookings</span><span class="count" id="mine-count">0</span>
      </button>
      <div class="menu-wrap">
        <button class="avatar" id="avatar" type="button" aria-haspopup="true" aria-expanded="false" title="Profile">?</button>
        <div class="menu hidden" id="menu">
          <div class="menu-user"><strong id="user-name"></strong><span class="muted small" id="user-email"></span></div>
          <div class="menu-label">Colour theme</div>
          <div class="swatches" id="swatches">
            <button class="swatch" data-theme="violet" title="Violet" style="background:linear-gradient(135deg,#6d5dfc,#22d3ee)"></button>
            <button class="swatch" data-theme="ocean" title="Ocean" style="background:linear-gradient(135deg,#0ea5e9,#34d399)"></button>
            <button class="swatch" data-theme="sunset" title="Sunset" style="background:linear-gradient(135deg,#f43f5e,#fb923c)"></button>
            <button class="swatch" data-theme="mint" title="Mint" style="background:linear-gradient(135deg,#10b981,#a3e635)"></button>
          </div>
          <div class="menu-label">Mode</div>
          <div class="segmented" id="modes">
            <button type="button" data-mode="auto">Auto</button>
            <button type="button" data-mode="light">Light</button>
            <button type="button" data-mode="dark">Dark</button>
          </div>
          <button class="btn" id="logout" type="button">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page tool">
    <section class="map-card">
      <div class="building" id="building"></div>
      <div class="map-legend" aria-hidden="true">
        <span><i style="background:var(--free)"></i>Free</span>
        <span><i style="background:var(--shared)"></i>Shared</span>
        <span><i style="background:var(--full)"></i>Full</span>
      </div>
    </section>

    <section class="picker" id="picker">
      <div class="cal">
        <div class="cal-month">
          <div class="month-head">
            <button class="nav-sm m-prev" type="button" aria-label="Previous month">‹</button>
            <b class="m-title"></b>
            <button class="nav-sm m-next" type="button" aria-label="Next month">›</button>
          </div>
          <div class="grid7 m-grid"></div>
        </div>
        <div class="cal-time">
          <div class="cal-row"><span class="lbl">When</span><button class="anytime" type="button">Any time</button></div>
          <div class="cal-row"><span class="lbl">From</span>
            <div class="time"><button type="button" class="t-dn" aria-label="Earlier">‹</button><output class="t-out"></output><button type="button" class="t-up" aria-label="Later">›</button></div>
          </div>
          <div class="cal-row"><span class="lbl">For</span><div class="durs"></div></div>
        </div>
      </div>

      <h2 class="picker-title">Rooms today</h2>
      <div class="stage">
        <button class="arrow prev" type="button" aria-label="Previous rooms"><svg class="icon"><use href="#i-prev"/></svg></button>
        <div class="picks"></div>
        <button class="arrow next" type="button" aria-label="Next rooms"><svg class="icon"><use href="#i-next"/></svg></button>
      </div>
      <div class="dots"></div>
    </section>
  </main>

  <dialog class="sheet" id="room-dialog" aria-labelledby="room-title"></dialog>

  <dialog class="drawer" id="mine-drawer" aria-labelledby="mine-title">
    <div class="drawer-head">
      <div><h2 id="mine-title">My bookings</h2><span class="muted small">Up to 4 hours per day</span></div>
      <button class="icon-btn" type="button" data-close aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="drawer-body" id="mine-body"></div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room V · Find a room</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">V</span>
      <div>
        <div class="brand-name">Room V</div>
        <div class="brand-sub">Smart Campus · Building V</div>
      </div>
    </div>

    <form class="search" id="search-form" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-input" type="search" list="room-ids" placeholder="Search a room, e.g. V.1.07a" aria-label="Search a room">
      <datalist id="room-ids"></datalist>
      <kbd class="search-hint">/</kbd>
    </form>

    <div class="topbar-right">
      <span class="source-badge" id="source-badge" title="Where the room data comes from">…</span>
    </div>
  </header>
  <p class="search-msg" id="search-msg" role="status"></p>

  <main class="layout">
    <section class="stats" id="stats" aria-label="Building overview"></section>

    <section class="card viewer">
      <div class="card-head">
        <h2>Building V</h2>
        <div class="floor-filter" id="floor-filter" role="group" aria-label="Floor">
          <button type="button" data-floor="" class="active">All</button>
          <button type="button" data-floor="0">Floor 0</button>
          <button type="button" data-floor="1">Floor 1</button>
          <button type="button" data-floor="2">Floor 2</button>
        </div>
      </div>
      <div class="building" id="building"></div>
      <div class="legend">
        <span><i class="dot free"></i>Free</span>
        <span><i class="dot partial"></i>Partly booked</span>
        <span><i class="dot full"></i>Fully booked</span>
        <span><i class="dot loud"></i>Loud right now</span>
      </div>
    </section>

    <aside class="card panel" id="room-panel" aria-live="polite"></aside>

    <section class="card rooms">
      <div class="card-head">
        <h2>All rooms</h2>
        <span class="muted" id="updated"></span>
      </div>
      <div class="room-list" id="room-list"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>

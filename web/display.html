<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room display</title>
<!--
  The board room's touch display (app/display.py opens it as a small window: /display.html?room=Z.1.04&token=...).
  Laid out for the Infineon E84 kit's 4.3" 800x480 panel and scaled to whatever window it gets.
  One large card per feature (swipe, arrows, dots or keyboard). Quiet, academic look: paper and ink, serif headings,
  hairline rules, numbered sections, one accent colour; red only for SOS.
  API: docs/PLAN.md, "Room display". The selfie uses this computer's webcam; without one, the board camera's frame.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
  :root {
    --paper: #f4f1ea; --card: #fbfaf6; --ink: #17171a; --ink-2: #3b3a36; --muted: #5f5a50;
    --rule: #d8d2c4; --rule-strong: #b9b1a0; --accent: #22408f; --accent-soft: #e3e8f4;
    --free: #1d7a4c; --shared: #9a5a00; --full: #a3231b; --ghost: #5f43c9; --closed: #6b7280; --break: #9a5a00;
    --sos: #b3261e; --focus: #c2410c;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2a2925; overflow: hidden; }
  body { font-family: var(--sans); color: var(--ink); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  button:disabled { opacity: .35; cursor: default; }
  .hidden { display: none !important; }
  svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .serif { font-family: var(--serif); font-weight: 500; letter-spacing: -.01em; }
  .label { font-size: 16px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* the fixed 800x480 screen, scaled to the window */
  #screen { position: absolute; left: 0; top: 0; width: 800px; height: 480px; transform-origin: 0 0;
            background: var(--paper); overflow: hidden; user-select: none; -webkit-user-select: none; }

  /* top bar */
  .bar { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 24px; border-bottom: 1px solid var(--rule); }
  .room { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 16px; }
  .room b { font-family: var(--serif); font-size: 30px; font-weight: 500; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--ink-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .tag { font-size: 16px; font-weight: 600; padding: 6px 12px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .clock { font-size: 20px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .ghostbtn { height: 48px; min-width: 56px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--rule-strong); font-size: 16px; font-weight: 600; }
  .sos { height: 48px; padding: 0 18px; border-radius: 10px; background: var(--sos); color: #fff; font-size: 18px; font-weight: 700;
         letter-spacing: .06em; display: inline-flex; align-items: center; gap: 8px; }

  /* home: carousel */
  #home { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; }
  .track { position: absolute; left: 0; right: 0; top: 24px; height: 304px; display: flex; gap: 28px; padding: 0 120px;
           overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }
  .track.dragging { scroll-snap-type: none; scroll-behavior: auto; }
  .card { flex: 0 0 560px; height: 304px; scroll-snap-align: center; background: var(--card); border: 1px solid var(--rule);
          border-radius: 4px; padding: 26px 32px 28px; text-align: left; display: flex; flex-direction: column; position: relative;
          box-shadow: 0 1px 0 #00000008, 0 12px 30px -22px #3a2e1a55; transition: opacity .3s, transform .3s; }
  .card:not(.current) { opacity: .45; transform: scale(.95); }
  .card .num { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .card .num svg { font-size: 30px; color: var(--accent); }
  .card h2 { font-family: var(--serif); font-weight: 500; font-size: 42px; line-height: 1.05; margin: 18px 0 8px; letter-spacing: -.015em; }
  .card p { margin: 0; font-size: 20px; line-height: 1.4; color: var(--muted); max-width: 470px; }
  .card .cta { margin-top: auto; height: 60px; border-radius: 6px; background: var(--ink); color: var(--card); font-size: 20px; font-weight: 600;
               display: flex; align-items: center; justify-content: space-between; padding: 0 22px; }
  .card .cta svg { font-size: 24px; }
  .card.on { border-color: var(--accent); }
  .card.on .cta { background: var(--accent); }
  .nav { position: absolute; top: 144px; width: 64px; height: 64px; border-radius: 50%; background: var(--card); border: 1px solid var(--rule-strong);
         display: grid; place-items: center; font-size: 28px; z-index: 2; box-shadow: 0 6px 16px -10px #3a2e1a66; }
  .nav.prev { left: 24px; } .nav.next { right: 24px; }
  .nav:disabled { opacity: 0; pointer-events: none; }
  .dots { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 4px; }
  .dots button { width: 44px; height: 44px; display: grid; place-items: center; }
  .dots button span { width: 22px; height: 3px; background: var(--rule-strong); transition: background .2s, width .2s; }
  .dots button[aria-current="true"] span { width: 34px; background: var(--ink); }

  /* feature sheets */
  .sheet { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; padding: 0 24px 22px; display: flex; flex-direction: column; }
  .sheet-head { height: 84px; flex: none; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
  .back { height: 52px; padding: 0 18px 0 12px; border-radius: 10px; border: 1px solid var(--rule-strong); font-size: 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .back svg { font-size: 24px; }
  .sheet-head .num { font-size: 16px; font-weight: 600; letter-spacing: .08em; color: var(--accent); flex: none; }
  .sheet-head h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 34px; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-body { flex: 1; min-height: 0; display: flex; gap: 32px; align-items: center; }
  .lead { font-size: 22px; line-height: 1.4; margin: 0; color: var(--ink-2); }
  .small { font-size: 16px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
  .btn { height: 64px; border-radius: 8px; font-size: 21px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 24px; }
  .btn svg { font-size: 24px; }
  .btn.ink { background: var(--ink); color: var(--card); }
  .btn.accent { background: var(--accent); color: #fff; }
  .btn.line { border: 1px solid var(--rule-strong); background: var(--card); }
  .round { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--card); font-size: 26px; display: grid; place-items: center; flex: none; }
  .qr { background: #fff; border: 1px solid var(--rule); padding: 12px; flex: none; display: grid; place-items: center; }
  .qr img, .qr svg { display: block; width: 100%; height: 100%; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 0; width: 100%; }

  /* sounds: eight large tiles */
  .sounds { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px; }
  .snd { border: 1px solid var(--rule); background: var(--card); border-radius: 6px; padding: 16px 16px 14px; text-align: left;
         display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .snd svg { font-size: 36px; color: var(--accent); }
  .snd span { font-size: 21px; font-weight: 600; line-height: 1.15; hyphens: auto; overflow-wrap: break-word; }
  .snd small { display: block; font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
  .snd[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .snd[aria-pressed="true"] svg { color: var(--card); }
  .vol { display: flex; align-items: center; gap: 10px; flex: none; }
  .vol output { width: 64px; text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* selfie */
  .cam { width: 380px; height: 285px; background: #111; position: relative; overflow: hidden; flex: none; border: 1px solid var(--rule-strong); }
  .cam video, .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam video { transform: scaleX(-1); }
  .cam .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--serif); font-size: 160px; color: #fff; text-shadow: 0 4px 30px #000a; }
  .cam .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .cam .flash.go { opacity: 1; transition: none; }
  .cam .camnote { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 36px; font-size: 18px; color: #d6d0c4; line-height: 1.4; }

  /* break */
  .numeral { font-family: var(--serif); font-weight: 500; font-size: 110px; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .numeral small { font-family: var(--sans); font-size: 22px; font-weight: 600; letter-spacing: .04em; margin-left: 6px; color: var(--muted); }

  /* emergency */
  .modal { position: absolute; inset: 0; background: rgb(23 23 26 / 72%); display: grid; place-items: center; z-index: 10; }
  .mcard { width: 600px; background: var(--card); border-top: 6px solid var(--sos); padding: 28px 36px 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px -20px #000a; }
  .mcard .kicker { color: var(--sos); display: flex; align-items: center; gap: 8px; }
  .mcard .kicker svg { font-size: 22px; }
  .mcard h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 36px; line-height: 1.1; }
  .mcard .row { display: flex; gap: 14px; margin-top: 8px; }
  .mcard .row .btn { flex: 1; }
  .btn.danger { background: var(--sos); color: #fff; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .banner { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: var(--sos); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 600; z-index: 5; }

  .toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: max-content; max-width: 680px; background: var(--ink); color: var(--card);
           font-size: 18px; line-height: 1.35; padding: 14px 22px; border-radius: 8px; z-index: 20; box-shadow: 0 14px 30px -12px #000a; text-align: center; }
  .offline { position: absolute; left: 0; right: 0; top: 64px; background: #f2d9a6; color: var(--ink); font-size: 16px; font-weight: 600; text-align: center; padding: 6px; z-index: 6; border-bottom: 1px solid #d9b56b; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div id="screen">
  <header class="bar">
    <div class="room"><b id="label">Room</b><span class="status"><span class="dot" id="dot"></span><span id="statusText">…</span></span></div>
    <span class="tag hidden" id="quietTag"></span>
    <span class="clock" id="clock" aria-hidden="true">--:--</span>
    <button class="ghostbtn" id="lang"></button>
    <button class="sos" id="sos"></button>
  </header>

  <div class="offline hidden" id="offline" role="alert"></div>

  <main id="home">
    <button class="nav prev" id="prev"></button>
    <div class="track" id="track" role="group" aria-roledescription="carousel"></div>
    <button class="nav next" id="next"></button>
    <div class="dots" id="dots" role="tablist"></div>
  </main>

  <!-- 01 book -->
  <section class="sheet hidden" id="sheet-book" aria-labelledby="h-book">
    <div class="sheet-head"><button class="back" data-back></button><span class="num">01</span><h2 id="h-book" data-t="book_title"></h2></div>
    <div class="sheet-body">
      <div class="qr" style="width:290px;height:290px"><img id="bookQr" alt=""></div>
      <div class="col">
        <p class="lead" data-t="book_lead"></p>
        <hr class="rule">
        <p class="label" data-t="book_now_label"></p>
        <p class="lead serif" style="font-size:30px;margin-top:-10px" id="bookNow"></p>
        <p class="small" id="bookUrl"></p>
      </div>
    </div>
  </section>

  <!-- 02 soundscapes -->
  <section class="sheet hidden" id="sheet-sound" aria-labelledby="h-sound">
    <div class="sheet-head">
      <button class="back" data-back></button><span class="num">02</span><h2 id="h-sound" data-t="sound_title"></h2>
      <div class="vol" role="group" id="volGroup">
        <button class="round" id="volDown">−</button><output id="volVal" aria-live="polite"></output><button class="round" id="volUp">+</button>
      </div>
    </div>
    <div class="sounds" id="sounds"></div>
  </section>

  <!-- 03 selfie -->
  <section class="sheet hidden" id="sheet-selfie" aria-labelledby="h-selfie">
    <div class="sheet-head"><button class="back" data-back></button><span class="num">03</span><h2 id="h-selfie" data-t="selfie_title"></h2></div>
    <div class="sheet-body" style="align-items:stretch">
      <div class="cam" id="cam">
        <video id="video" autoplay playsinline muted></video>
        <img id="shot" class="hidden" alt="">
        <div class="camnote hidden" id="camNote"></div>
        <div class="count hidden" id="count" aria-live="assertive"></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="col" id="selfieCtrl" style="justify-content:space-between">
        <p class="lead" data-t="selfie_lead"></p>
        <button class="btn ink" style="height:76px" id="shoot"></button>
      </div>
      <div class="col hidden" id="selfieDone" style="align-items:center;gap:12px">
        <div class="qr" style="width:176px;height:176px;padding:10px" id="selfieQr"></div>
        <p class="small" style="text-align:center;color:var(--ink-2)" id="selfieExp"></p>
        <div style="display:flex;gap:12px;width:100%;margin-top:auto">
          <button class="btn line" style="flex:1" id="retake"></button>
          <button class="btn ink" style="flex:1" data-back data-t="done"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 04 break -->
  <section class="sheet hidden" id="sheet-break" aria-labelledby="h-break">
    <div class="sheet-head"><button class="back" data-back></button><span class="num">04</span><h2 id="h-break" data-t="break_title"></h2></div>
    <div class="sheet-body" id="breakSetup">
      <div style="width:330px;flex:none;display:flex;flex-direction:column;align-items:center;gap:22px">
        <div class="numeral" id="bMin" aria-live="polite"></div>
        <div style="display:flex;gap:18px;align-items:center">
          <button class="round" style="width:72px;height:72px;font-size:32px" id="bDown">−</button>
          <span class="label" style="width:110px;text-align:center" data-t="minutes_label"></span>
          <button class="round" style="width:72px;height:72px;font-size:32px" id="bUp">+</button>
        </div>
      </div>
      <div class="col" style="align-self:stretch;justify-content:space-between;border-left:1px solid var(--rule);padding-left:32px">
        <div style="display:flex;flex-direction:column;gap:12px">
          <p class="lead" data-t="break_lead"></p>
          <p class="small" id="bBackBy"></p>
        </div>
        <button class="btn ink" id="bStart"></button>
      </div>
    </div>
    <div class="sheet-body hidden" id="breakActive" style="flex-direction:column;justify-content:center;gap:10px;text-align:center">
      <p class="label" data-t="break_held"></p>
      <div class="numeral" style="font-size:120px" id="bLeft" role="timer"></div>
      <p class="lead" id="bUntil"></p>
      <div style="display:flex;gap:14px;justify-content:center;margin-top:8px">
        <button class="btn line" style="min-width:180px" id="bMore"></button>
        <button class="btn ink" style="min-width:240px" id="bBack"></button>
      </div>
    </div>
  </section>

  <!-- emergency -->
  <div class="modal hidden" id="sosAsk" role="alertdialog" aria-modal="true" aria-labelledby="sosAskTitle">
    <div class="mcard">
      <p class="label kicker" id="sosAskKicker"></p>
      <h2 id="sosAskTitle" data-t="sos_ask"></h2>
      <p class="lead" style="font-size:20px" data-t="sos_ask_lead"></p>
      <div class="row">
        <button class="btn line" id="sosNo" data-t="cancel"></button>
        <button class="btn danger" id="sosYes" data-t="sos_yes"></button>
      </div>
    </div>
  </div>
  <div class="modal hidden" id="sosOpen" role="alertdialog" aria-modal="true" aria-labelledby="sosOpenTitle">
    <div class="mcard">
      <p class="label kicker pulse" id="sosOpenKicker"></p>
      <h2 id="sosOpenTitle" data-t="sos_open"></h2>
      <p class="lead" style="font-size:20px" id="sosOpenText"></p>
      <div class="row"><button class="btn line" id="sosHide" data-t="sos_hide"></button></div>
    </div>
  </div>
  <div class="banner hidden" id="sosBanner" role="alert"></div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const ROOM = params.get("room") || "Z.1.04";
  const TOKEN = params.get("token") || "";
  const API = `/api/display/${encodeURIComponent(ROOM)}`;
  const BREAK_MIN = 5, BREAK_MAX = 30, BREAK_STEP = 5;
  const IDLE_MS = 90000;

  /* ---------- text (English / German, like the website) ---------- */
  const T = {
    en: {
      lang_btn: "DE", lang_aria: "Deutsch", sos: "SOS", sos_aria: "Emergency",
      prev: "Previous", next: "Next", back: "Back", done: "Done", cancel: "Cancel",
      st_free: "Free", st_partial: "Shared", st_full: "Booked", st_ghost: "Booked, nobody here",
      st_closed: "Closed", st_unbookable: "Live status only", st_break: "On break until {t}",
      people_0: "nobody here", people_1: "1 person here", people_n: "{n} people here",
      quiet_tag: "Quiet room",
      c_book: "Book this room", c_book_p: "Scan a QR code with your phone to reserve it.", c_book_cta: "Show the QR code",
      c_sound: "Soundscapes", c_sound_p: "Rain, ocean, forest and more, to help you focus.", c_sound_cta: "Choose a sound",
      c_sound_on: "Now playing: {s}.",
      c_selfie: "Group selfie", c_selfie_p: "Take a photo together and download it by QR code.", c_selfie_cta: "Open the camera",
      c_break: "Take a break", c_break_p: "Step out for a while without losing the room.", c_break_cta: "Plan a break",
      c_break_on: "On break: {m} min left.",
      c_quiet: "Quiet room", c_quiet_p_off: "Ask everyone to keep silent. The website shows it too.",
      c_quiet_p_on: "On. Others see this as a silent study room.", c_quiet_cta_off: "Turn on", c_quiet_cta_on: "Turn off",
      book_title: "Book this room", book_lead: "Point your phone camera at the code. It opens this room on the booking website.",
      book_now_label: "Right now", book_free: "Free", book_until: "Booked until {t}",
      sound_title: "Soundscapes", playing: "Playing", vol_down: "Quieter", vol_up: "Louder",
      s_off: "Silence", s_rain: "Rain", s_ocean: "Ocean", s_forest: "Forest", s_cafe: "Café", s_white: "White noise",
      s_pink: "Pink noise", s_brown: "Brown noise",
      selfie_title: "Group selfie", selfie_lead: "Get everyone into the picture. The photo is taken three seconds after you press the button.",
      shoot: "Take the photo", retake: "Retake", selfie_exp: "Scan to download. Deleted at {t}.",
      cam_none: "No webcam found. The room camera will take the photo.", cam_starting: "Starting the camera…",
      selfie_fail: "Couldn't take the photo: {e}",
      break_title: "Take a break", break_lead: "The room stays yours while everyone steps out. It won't be released as empty.",
      minutes_label: "minutes", start_break: "Start the break", break_held: "The room is held for you", back_by: "Back by {t}",
      more5: "+5 min", im_back: "I'm back", minus: "Five minutes less", plus: "Five minutes more",
      sos_kicker: "Emergency", sos_ask: "Call emergency services?", sos_ask_lead: "Campus security is told that there is an emergency in this room.",
      sos_yes: "Yes, call now", sos_open_kicker: "Emergency reported", sos_open: "Help has been called",
      sos_open_text: "Reported at {t}. Stay calm, and stay in the room if it is safe.",
      sos_hide: "Hide this message", sos_banner: "Emergency reported at {t}. Help is on the way.",
      offline: "No connection to the server. Retrying…", no_token: "This display isn't paired with the room (token missing).",
      err_no_booking: "Nobody has booked this room right now, so there's nothing to hold. Book it first.",
      err_no_camera: "no webcam here and the room camera is off."
    },
    de: {
      lang_btn: "EN", lang_aria: "English", sos: "SOS", sos_aria: "Notfall",

  /* ---------- 02 soundscapes (synthesised in the page: no sound files) ---------- */
  const Synth = (() => {
    let ctx, master, nodes = [], timers = [], playing = "off";
    function ensure() {
      if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.connect(ctx.destination); }
      if (ctx.state === "suspended") ctx.resume();
    }
    const bufs = {};
    function noiseBuf(type) {
      if (bufs[type]) return bufs[type];
      const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      let last = 0, b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (type === "white") d[i] = w * 0.5;
        else if (type === "brown") { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
        else {
          b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
          b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;

    function noise(type, ftype, freq, q, gain) {

      const f = ctx.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(); g.gain.value = gain;
      src.connect(f).connect(g).connect(master); src.start(); nodes.push(src, f, g);
      return { f, g };
    }
    function lfo(param, rate, depth) {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = rate; g.gain.value = depth;
      o.connect(g).connect(param); o.start(); nodes.push(o, g);
    }
    function every(min, max, fn) {
      const tm = { alive: true };
      const tick = () => { if (!tm.alive) return; fn(); tm.id = setTimeout(tick, min + Math.random() * (max - min)); };
      tm.id = setTimeout(tick, Math.random() * min); timers.push(tm);
    }
    function chirp() {
      const o = ctx.createOscillator(), g = ctx.createGain(), now = ctx.currentTime, base = 2200 + Math.random() * 1800, n = 2 + Math.floor(Math.random() * 3);
      o.frequency.setValueAtTime(base, now);
      for (let i = 0; i < n; i++) { o.frequency.linearRampToValueAtTime(base * (1.3 + Math.random() * 0.4), now + i * 0.12 + 0.05); o.frequency.linearRampToValueAtTime(base, now + i * 0.12 + 0.11); }
      g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.06, now + 0.02); g.gain.linearRampToValueAtTime(0, now + n * 0.12 + 0.05);
      o.connect(g).connect(master); o.start(now); o.stop(now + n * 0.12 + 0.1);
    }
    function burst(freq, q, peak, dur) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf("white");
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(), now = ctx.currentTime;
      g.gain.setValueAtTime(peak, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(f).connect(g).connect(master); src.start(now, Math.random() * 3); src.stop(now + dur + 0.02);
    }
    function clink() {
      const o = ctx.createOscillator(), g = ctx.createGain(), now = ctx.currentTime;
      o.frequency.value = 2600 + Math.random() * 1600;
      g.gain.setValueAtTime(0.025, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.45);
    }
    const presets = {
      rain() { noise("pink", "highpass", 400, 0.5, 0.55); noise("white", "bandpass", 3500, 0.9, 0.06); every(25, 140, () => burst(2500 + Math.random() * 3000, 3, 0.05, 0.03)); },
      ocean() { const n = noise("brown", "lowpass", 600, 0.7, 0.35); lfo(n.g.gain, 0.08, 0.3); lfo(n.f.frequency, 0.08, 350); },
      forest() { noise("pink", "bandpass", 1400, 0.6, 0.3); noise("brown", "lowpass", 400, 0.7, 0.25); every(700, 2600, chirp); },
      cafe() { const n = noise("brown", "bandpass", 420, 1.1, 0.5); lfo(n.g.gain, 0.6, 0.12); noise("pink", "bandpass", 900, 2, 0.06); every(1800, 5000, clink); },
      white() { noise("white", "lowpass", 9000, 0.7, 0.3); },
      pink() { noise("pink", "lowpass", 9000, 0.7, 0.45); },
      brown() { noise("brown", "lowpass", 1200, 0.7, 0.55); }
    };
    function stop() {
      nodes.forEach((n) => { try { n.stop && n.stop(); } catch {} try { n.disconnect(); } catch {} });
      timers.forEach((tm) => { tm.alive = false; clearTimeout(tm.id); }); nodes = []; timers = [];

      apply({ kind, volume }) {

          master.gain.setValueAtTime(0, ctx.currentTime);

        }

    };

  const soundsEl = $("sounds");

      if (b.dataset.html !== html) { b.dataset.html = html; b.innerHTML = html; }
    });
    $("volVal").textContent = sound.volume + "%";
    $("volDown").disabled = sound.volume <= 0; $("volUp").disabled = sound.volume >= 100;
  }
  const vol = (d) => setSound({ kind: sound.kind, volume: Math.max(0, Math.min(100, sound.volume + d)) });
  $("volDown").addEventListener("click", () => vol(-10));
  $("volUp").addEventListener("click", () => vol(10));

  /* ---------- 03 selfie (this computer's webcam; the board camera if there is none) ---------- */
  const video = $("video");
  let stream = null, countdownT = 0, useBoardCam = false;
  async function camStart() {
    useBoardCam = false;
    $("camNote").textContent = t("cam_starting"); $("camNote").classList.remove("hidden");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
      if (openSheet !== "selfie") { camStop(); return; }
      video.srcObject = stream; video.classList.remove("hidden"); $("camNote").classList.add("hidden");
    } catch {
      useBoardCam = true; video.classList.add("hidden");
      $("camNote").textContent = t("cam_none");
    }
  }
  function camStop() {
    if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; }
    video.srcObject = null;
  }
  function selfieReset() {
    clearInterval(countdownT); countdownT = 0;
    $("count").classList.add("hidden"); $("shot").classList.add("hidden");
    $("selfieCtrl").classList.remove("hidden"); $("selfieDone").classList.add("hidden");
    if (stream) video.classList.remove("hidden");
  }
  $("shoot").addEventListener("click", () => {
    if (countdownT) return;
    let n = 3; const c = $("count"); c.textContent = n; c.classList.remove("hidden");
    countdownT = setInterval(() => {
      n--; if (n > 0) { c.textContent = n; return; }
      clearInterval(countdownT); countdownT = 0; c.classList.add("hidden"); takeSelfie();
    }, 1000);
  });
  async function takeSelfie() {
    const fl = $("flash"); fl.classList.add("go"); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove("go")));
    let body;
    if (!useBoardCam && stream) {
      const cv = document.createElement("canvas"); cv.width = video.videoWidth || 640; cv.height = video.videoHeight || 480;
      // the live preview is mirrored like a mirror; the photo itself isn't, so text in it reads normally
      cv.getContext("2d").drawImage(video, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL("image/jpeg", 0.85);
      $("shot").src = data; $("shot").classList.remove("hidden"); video.classList.add("hidden");
      body = { image: data.split(",")[1] };
    }
    try {
      const r = await api("POST", "/selfie", body);
      $("selfieQr").innerHTML = r.qr_svg;   // SVG made by our own backend (segno)
      $("selfieExp").textContent = t("selfie_exp", { t: hhmm(parseLocal(r.expires_at)) });
      $("selfieCtrl").classList.add("hidden"); $("selfieDone").classList.remove("hidden");
    } catch (e) {
      toast(t("selfie_fail", { e: errText(e) }));
      selfieReset();
    }
  }
  $("retake").addEventListener("click", selfieReset);

  /* ---------- 04 take a break ---------- */
  let breakMinutes = 15;
  $("bDown").addEventListener("click", () => { breakMinutes = Math.max(BREAK_MIN, breakMinutes - BREAK_STEP); renderBreak(); });
  $("bUp").addEventListener("click", () => { breakMinutes = Math.min(BREAK_MAX, breakMinutes + BREAK_STEP); renderBreak(); });
  async function startBreak(minutes) {
    try { const r = await api("POST", "/break", { minutes }); if (S) S.break_until = r.break_until; render(); }
    catch (e) { fail(e); }
  }
  $("bStart").addEventListener("click", () => startBreak(breakMinutes));
  $("bMore").addEventListener("click", () => {
    const brk = breakUntil(); if (!brk) return;
    startBreak(Math.min(BREAK_MAX, Math.ceil((brk - new Date()) / 60000) + 5));
  });
  $("bBack").addEventListener("click", async () => {
    try { await api("DELETE", "/break"); if (S) S.break_until = null; render(); } catch (e) { fail(e); }
  });
  function renderBreak() {
    $("bMin").textContent = breakMinutes;
    $("bBackBy").textContent = t("back_by", { t: hhmm(new Date(Date.now() + breakMinutes * 60000)) });
    $("bDown").disabled = breakMinutes <= BREAK_MIN; $("bUp").disabled = breakMinutes >= BREAK_MAX;
    const brk = breakUntil();
    $("breakSetup").classList.toggle("hidden", !!brk); $("breakActive").classList.toggle("hidden", !brk);
    if (brk) {
      const left = Math.max(0, Math.round((brk - new Date()) / 1000));
      $("bLeft").textContent = `${pad2(Math.floor(left / 60))}:${pad2(left % 60)}`;
      $("bUntil").textContent = t("back_by", { t: hhmm(brk) });
      $("bMore").disabled = Math.ceil(left / 60) + 5 > BREAK_MAX;
    }
  }
  setInterval(() => { if (openSheet === "break") renderBreak(); }, 1000);

  /* ---------- emergency ---------- */
  let sosHidden = null;   // id of the emergency whose big message was hidden
  $("sos").addEventListener("click", () => { $("sosAsk").classList.remove("hidden"); $("sosNo").focus(); });
  $("sosNo").addEventListener("click", () => { $("sosAsk").classList.add("hidden"); $("sos").focus(); });
  $("sosYes").addEventListener("click", async () => {
    $("sosAsk").classList.add("hidden");
    try {
      const em = await api("POST", "/emergency", { confirm: true });
      if (S) S.emergency = em; sosHidden = null; renderEmergency();
    } catch (e) { fail(e); }
  });
  $("sosHide").addEventListener("click", () => { sosHidden = S && S.emergency && S.emergency.id; renderEmergency(); });
  function renderEmergency() {
    const em = S && S.emergency;
    const at = em ? hhmm(parseLocal(em.created_at)) : "";
    $("sosOpen").classList.toggle("hidden", !em || sosHidden === em.id);
    $("sosBanner").classList.toggle("hidden", !em || sosHidden !== em.id);
    if (em) {
      $("sosOpenText").textContent = t("sos_open_text", { t: at });
      $("sosBanner").innerHTML = ic("phone") + t("sos_banner", { t: at });
    }
  }

  /* ---------- static text + language ---------- */
  function applyText() {
    document.documentElement.lang = lang;
    $("lang").textContent = t("lang_btn"); $("lang").setAttribute("aria-label", t("lang_aria"));
    $("sos").innerHTML = ic("alert") + t("sos"); $("sos").setAttribute("aria-label", t("sos_aria"));
    $("prev").innerHTML = ic("left"); $("prev").setAttribute("aria-label", t("prev"));
    $("next").innerHTML = ic("right"); $("next").setAttribute("aria-label", t("next"));
    track.setAttribute("aria-label", S ? S.label : ROOM);
    document.querySelectorAll("[data-back]").forEach((b) => { if (!b.dataset.t) b.innerHTML = ic("left") + t("back"); });
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
    $("shoot").innerHTML = ic("camera") + t("shoot");
    $("retake").textContent = t("retake");
    $("bStart").innerHTML = t("start_break") + ic("arrow");
    $("bMore").textContent = t("more5"); $("bBack").innerHTML = ic("check") + t("im_back");
    $("bDown").setAttribute("aria-label", t("minus")); $("bUp").setAttribute("aria-label", t("plus"));
    $("volDown").setAttribute("aria-label", t("vol_down")); $("volUp").setAttribute("aria-label", t("vol_up"));
    $("sosAskKicker").innerHTML = ic("alert") + t("sos_kicker"); $("sosOpenKicker").innerHTML = ic("phone") + t("sos_open_kicker");
    renderCards(); renderSound(); renderBreak();
    if (S) render();
  }
  $("lang").addEventListener("click", () => {
    lang = lang === "en" ? "de" : "en";
    try { localStorage.setItem("roomv-lang", lang); } catch {}
    applyText();
  });

  /* ---------- keyboard ---------- */
  addEventListener("keydown", (e) => {
    if (!$("sosAsk").classList.contains("hidden")) { if (e.key === "Escape") $("sosNo").click(); return; }
    if (openSheet) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") goTo(current + 1);
    else if (e.key === "ArrowLeft") goTo(current - 1);
  });

  /* ---------- back to the first card after 90 s without a touch ---------- */
  let lastTouch = Date.now();
  ["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => { lastTouch = Date.now(); }, true));
  setInterval(() => {
    if (Date.now() - lastTouch < IDLE_MS || countdownT || !$("sosAsk").classList.contains("hidden")) return;
    if (openSheet) closeSheet();
    if (current !== 0) goTo(0);
    lastTouch = Date.now();
  }, 5000);

  /* ---------- go ---------- */
  applyText();
  goTo(0, false);
  poll(); setInterval(poll, 1500);
})();
</script>
</body>
</html>

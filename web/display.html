<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room display</title>
<!--
  The board room's touch display (app/display.py opens it as a small window: /display.html?room=Z.1.04&token=...).
  Laid out for the Infineon E84 kit's 4.3" 800x480 panel and scaled to whatever window it gets.
  Home: one row of big buttons that scrolls sideways (finger, mouse drag, wheel, the arrows or arrow keys), the room's
  status first. Plain campus-system look: Arial, square boxes, grey lines, AAU blue.
  Shown without a button: a break-and-water reminder every 45 minutes of study, and a fire-alarm alert for deaf
  students when the microphone hears a smoke alarm's beeps (~3 kHz, three in a row). Sound is analysed in the page and
  never recorded or sent.
  URL options: room, token, water=<minutes> (default 45), demo=1 (keys W = break reminder, F = fire alarm test).
  API: docs/PLAN.md, "Room display".
-->
<style>
  :root {
    --aau: #497284; --aau-light: #57a0c7; --aau-dark: #34586a;
    --bg: #f2f2f2; --white: #fff; --line: #bdbdbd; --line-soft: #dcdcdc; --head-bg: #e8edf0;
    --text: #222; --muted: #555;
    --free: #2e7d32; --shared: #a15c00; --full: #c62828; --ghost: #5e35b1; --closed: #757575; --break: #a15c00;
    --sos: #c62828; --focus: #f2a900;
    --font: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #333; overflow: hidden; }
  body { font-family: var(--font); color: var(--text); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: default; }
  .hidden { display: none !important; }
  svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .label { font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

  #screen { position: absolute; left: 0; top: 0; width: 800px; height: 480px; transform-origin: 0 0;
            background: var(--bg); overflow: hidden; user-select: none; -webkit-user-select: none; }

  /* top bar */
  .bar { height: 64px; background: var(--white); border-bottom: 3px solid var(--aau); display: flex; align-items: center; gap: 14px; padding: 0 10px 0 14px; }
  .logo { height: 38px; display: flex; align-items: center; flex: none; }
  .logo img { height: 38px; width: auto; display: block; }
  .logo .word { font-size: 14px; font-weight: bold; line-height: 1.1; text-transform: uppercase; color: var(--aau); }
  .vr { width: 1px; height: 34px; background: var(--line); flex: none; }
  .roomid { font-size: 26px; font-weight: bold; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; }
  .ear { font-size: 20px; color: var(--aau); flex: none; display: grid; place-items: center; width: 24px; }
  .when { text-align: right; line-height: 1.15; flex: none; }
  .when b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .when span { font-size: 15px; color: var(--muted); }
  .langbtn { height: 46px; min-width: 52px; padding: 0 10px; border: 1px solid var(--line); background: var(--white); font-size: 17px; font-weight: bold; color: var(--aau); }
  .sos { height: 48px; padding: 0 16px; background: var(--sos); color: #fff; font-size: 20px; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; }

  /* home: one row of big buttons that scrolls sideways; the room's status comes first */
  #home { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; }
  .strip { position: absolute; left: 0; right: 0; top: 0; height: 362px; display: flex; gap: 14px; padding: 12px 16px;
           overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-padding: 0 16px; scroll-behavior: smooth;
           scrollbar-width: none; overscroll-behavior-x: contain; }
  .strip::-webkit-scrollbar { display: none; }
  .strip.dragging { scroll-snap-type: none; scroll-behavior: auto; }
  .item { flex: 0 0 236px; scroll-snap-align: start; background: var(--white); border: 1px solid var(--line); text-align: left;
          display: flex; flex-direction: column; overflow: hidden; }
  .item:active { background: #f6f8f9; }
  /* locked (Sounds without a booking): greyed, still readable, says why */
  .item:disabled { opacity: 1; cursor: default; background: #f7f7f7; }
  .item:disabled .big, .item:disabled h2 { color: #6f6f6f; }
  .item:disabled .open { background: #e0e0e0; color: #444; }
  .item .hd { background: var(--head-bg); border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; align-items: center; gap: 8px;
              font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: .03em; color: var(--aau-dark); white-space: nowrap; }
  .item .hd svg { font-size: 18px; }
  .item .bd { flex: 1; min-height: 0; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .item .big { font-size: 56px; color: var(--aau); margin-bottom: 4px; }
  .item h2 { margin: 0; font-size: 32px; line-height: 1.1; }
  .item p { margin: 0; font-size: 17px; line-height: 1.35; color: var(--muted); }
  .item .open { margin-top: auto; height: 56px; background: var(--aau); color: #fff; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
  /* the room card: wider, first in the row */
  .room { flex-basis: 300px; }
  .room .state { display: flex; align-items: center; gap: 10px; }
  .room .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .room h2 { font-size: 46px; }
  .room .water { margin-top: auto; border-top: 1px solid var(--line-soft); padding-top: 10px; display: flex; gap: 8px; align-items: center; font-size: 16px; color: var(--muted); }
  .room .water svg { font-size: 20px; color: var(--aau); }
  .pager { position: absolute; left: 0; right: 0; bottom: 8px; height: 40px; display: flex; align-items: center; justify-content: center; gap: 16px; }
  .pager .arrow { width: 64px; height: 40px; border: 1px solid var(--line); background: var(--white); display: grid; place-items: center; font-size: 22px; color: var(--aau); }
  .pager .track { width: 220px; height: 6px; background: var(--line-soft); position: relative; }
  .pager .thumb { position: absolute; top: 0; height: 6px; background: var(--aau); }

  /* feature sheets */
  .sheet { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; padding: 0 14px 14px; display: flex; flex-direction: column; background: var(--bg); }
  .sheet-head { height: 70px; flex: none; display: flex; align-items: center; gap: 14px; }
  .back { height: 50px; padding: 0 16px 0 10px; border: 1px solid var(--line); background: var(--white); font-size: 18px; font-weight: bold; color: var(--aau); display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .back svg { font-size: 22px; }
  .sheet-head h2 { margin: 0; font-size: 28px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-body { flex: 1; min-height: 0; display: flex; gap: 14px; align-items: stretch; }
  .box { background: var(--white); border: 1px solid var(--line); padding: 16px 18px; }
  .lead { font-size: 19px; line-height: 1.4; margin: 0; }
  .small { font-size: 15px; color: var(--muted); margin: 0; overflow-wrap: anywhere; line-height: 1.35; }
  .btn { height: 60px; font-size: 20px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; }
  .btn svg { font-size: 22px; }
  .btn.blue { background: var(--aau); color: #fff; }
  .btn.line { background: var(--white); border: 1px solid var(--line); color: var(--aau); }
  .btn.green { background: var(--free); color: #fff; }
  .sq { width: 58px; height: 58px; border: 1px solid var(--line); background: var(--white); color: var(--aau); font-size: 28px; font-weight: bold; display: grid; place-items: center; flex: none; }
  .qr { background: #fff; padding: 10px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); }
  .qr img, .qr svg { display: block; width: 100%; height: 100%; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  /* sounds */
  .sounds { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; }
  .snd { background: var(--white); border: 1px solid var(--line); padding: 12px 14px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .snd svg { font-size: 30px; color: var(--aau); }
  .snd span { font-size: 21px; font-weight: bold; line-height: 1.1; overflow-wrap: break-word; hyphens: auto; }
  .snd small { display: block; font-size: 15px; font-weight: bold; text-transform: uppercase; margin-top: 3px; }
  .snd[aria-pressed="true"] { background: var(--aau); color: #fff; border-color: var(--aau-dark); }
  .snd[aria-pressed="true"] svg { color: #fff; }
  .vol { display: flex; align-items: center; gap: 6px; flex: none; }
  .vol output { width: 64px; text-align: center; font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; }

  /* selfie */
  .cam { width: 380px; height: 285px; background: #222; position: relative; overflow: hidden; flex: none; align-self: center; border: 1px solid var(--line); }
  .cam video, .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam video { transform: scaleX(-1); }
  .cam .count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 150px; font-weight: bold; color: #fff; text-shadow: 0 2px 20px #000; }
  .cam .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .cam .flash.go { opacity: 1; transition: none; }
  .cam .camnote { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 36px; font-size: 17px; color: #ddd; line-height: 1.4; }

  /* break */
  .numeral { font-size: 110px; font-weight: bold; line-height: 1; color: var(--aau-dark); font-variant-numeric: tabular-nums; }

  /* emergency */
  .modal { position: absolute; inset: 0; background: rgb(0 0 0 / 60%); display: grid; place-items: center; z-index: 10; }
  .mcard { width: 600px; background: var(--white); border: 1px solid var(--line); border-top: 6px solid var(--sos); padding: 20px 26px 24px; display: flex; flex-direction: column; gap: 10px; }
  .mcard .kicker { color: var(--sos); display: flex; align-items: center; gap: 8px; }
  .mcard h2 { margin: 0; font-size: 32px; line-height: 1.1; }
  .mcard .row { display: flex; gap: 12px; margin-top: 6px; }
  .mcard .row .btn { flex: 1; }
  .btn.danger { background: var(--sos); color: #fff; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .banner { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; background: var(--sos); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: bold; z-index: 5; }

  /* break reminder (no button: shows by itself, tap anywhere or wait to close) */
  .remind { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; background: var(--aau-dark); color: #fff; z-index: 8;
            display: flex; align-items: center; gap: 34px; padding: 0 56px; }
  .remind .ic { font-size: 130px; flex: none; color: #cfe3ee; }
  .remind .ic svg { stroke-width: 1.5; }
  .remind h2 { font-size: 50px; line-height: 1; margin: 0 0 14px; }
  .remind p { font-size: 21px; line-height: 1.4; margin: 0; max-width: 480px; }
  .remind .timeline { position: absolute; left: 0; bottom: 0; height: 6px; background: #cfe3ee; animation: shrink linear forwards; }
  @keyframes shrink { from { width: 100%; } to { width: 0; } }

  /* fire alarm (from the alarm's sound): big, bilingual, slow pulse (1 Hz, well under the 3 flashes/s seizure limit) */
  .fire { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; z-index: 9; color: #fff; display: grid;
          grid-template-columns: 160px 1fr; align-items: center; gap: 24px; padding: 0 40px; animation: fire 1s steps(1) infinite; }
  @keyframes fire { 0% { background: #b71c1c; } 50% { background: #7f1010; } }
  .fire .bell { font-size: 140px; }
  .fire h2 { font-size: 60px; line-height: 1; margin: 0; }
  .fire h3 { font-size: 30px; line-height: 1; margin: 6px 0 14px; opacity: .9; }
  .fire p { font-size: 20px; line-height: 1.35; margin: 0 0 6px; }
  .fire p.de { opacity: .85; font-size: 17px; }
  .fire .src { margin-top: 10px; font-size: 15px; opacity: .85; display: flex; gap: 8px; align-items: center; }

  .toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: max-content; max-width: 680px; background: #333; color: #fff;
           font-size: 17px; line-height: 1.35; padding: 12px 20px; z-index: 20; text-align: center; }
  .offline { position: absolute; left: 0; right: 0; top: 64px; background: #ffe08a; color: var(--text); font-size: 15px; font-weight: bold; text-align: center; padding: 6px; z-index: 6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .fire { background: #b71c1c; }
  }
</style>
</head>
<body>
<div id="screen">
  <header class="bar">
    <div class="logo" id="logo"><img src="img/aau-logo.svg" alt="Universität Klagenfurt" id="logoImg"></div>
    <span class="vr"></span>
    <span class="roomid" id="label">Room</span>
    <span class="ear hidden" id="ear" role="img"></span>
    <div class="when" aria-hidden="true"><b id="clock">--:--</b><span id="date"></span></div>
    <button class="langbtn" id="lang"></button>
    <button class="sos" id="sos"></button>
  </header>

  <div class="offline hidden" id="offline" role="alert"></div>

  <main id="home">
    <div class="strip" id="strip" role="list"></div>
    <div class="pager">
      <button class="arrow" id="prev"></button>
      <span class="track" aria-hidden="true"><span class="thumb" id="thumb"></span></span>
      <button class="arrow" id="next"></button>
    </div>
  </main>

  <!-- book -->
  <section class="sheet hidden" id="sheet-book" aria-labelledby="h-book">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-book" data-t="book_title"></h2></div>
    <div class="sheet-body">
      <div class="qr" style="width:300px;height:300px;align-self:center"><img id="bookQr" alt=""></div>
      <div class="col box" style="justify-content:center">
        <p class="lead" data-t="book_lead"></p>
        <span class="label" style="margin-top:6px" data-t="book_now_label"></span>
        <p style="font-size:30px;font-weight:bold;margin:-6px 0 0" id="bookNow"></p>
        <p class="small" id="bookUrl"></p>
      </div>
    </div>
  </section>

  <!-- soundscapes -->
  <section class="sheet hidden" id="sheet-sound" aria-labelledby="h-sound">
    <div class="sheet-head">
      <button class="back" data-back></button><h2 id="h-sound" data-t="sound_title"></h2>
      <div class="vol" role="group"><button class="sq" id="volDown">−</button><output id="volVal" aria-live="polite"></output><button class="sq" id="volUp">+</button></div>
    </div>
    <div class="sounds" id="sounds"></div>
  </section>

  <!-- selfie -->
  <section class="sheet hidden" id="sheet-selfie" aria-labelledby="h-selfie">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-selfie" data-t="selfie_title"></h2></div>
    <div class="sheet-body">
      <div class="cam" id="cam">
        <video id="video" autoplay playsinline muted></video>
        <img id="shot" class="hidden" alt="">
        <div class="camnote hidden" id="camNote"></div>
        <div class="count hidden" id="count" aria-live="assertive"></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="col box" id="selfieCtrl" style="justify-content:space-between">
        <p class="lead" data-t="selfie_lead"></p>
        <button class="btn blue" style="height:72px" id="shoot"></button>
      </div>
      <div class="col box hidden" id="selfieDone" style="align-items:center;gap:10px;padding:14px 16px">
        <div class="qr" style="width:170px;height:170px;padding:8px" id="selfieQr"></div>
        <p class="small" style="text-align:center;color:var(--text)" id="selfieExp"></p>
        <div style="display:flex;gap:10px;width:100%;margin-top:auto">
          <button class="btn line" style="flex:1;height:56px" id="retake"></button>
          <button class="btn blue" style="flex:1;height:56px" data-back data-t="done"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- break -->
  <section class="sheet hidden" id="sheet-break" aria-labelledby="h-break">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-break" data-t="break_title"></h2></div>
    <div class="sheet-body" id="breakSetup">
      <div class="box" style="width:330px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
        <div class="numeral" id="bMin" aria-live="polite"></div>
        <div style="display:flex;gap:14px;align-items:center">
          <button class="sq" style="width:70px;height:70px;font-size:32px" id="bDown">−</button>
          <span class="label" style="width:100px;text-align:center" data-t="minutes_label"></span>
          <button class="sq" style="width:70px;height:70px;font-size:32px" id="bUp">+</button>
        </div>
      </div>
      <div class="col box" style="justify-content:space-between">
        <div style="display:flex;flex-direction:column;gap:10px">
          <p class="lead" data-t="break_lead"></p>
          <p class="small" id="bBackBy"></p>
        </div>
        <button class="btn blue" id="bStart"></button>
      </div>
    </div>
    <div class="sheet-body hidden box" id="breakActive" style="flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center">
      <span class="label" data-t="break_held"></span>
      <div class="numeral" style="font-size:120px" id="bLeft" role="timer"></div>
      <p class="lead" id="bUntil"></p>
      <div style="display:flex;gap:12px;margin-top:6px">
        <button class="btn line" style="min-width:170px" id="bMore"></button>
        <button class="btn green" style="min-width:230px" id="bBack"></button>
      </div>
    </div>
  </section>

  <!-- break reminder (shows by itself) -->
  <div class="remind hidden" id="remind" role="status" aria-live="polite">
    <div class="ic" id="remindIcon"></div>
    <div><h2 id="remindTitle"></h2><p id="remindText"></p></div>
    <div class="timeline" id="remindTimeline"></div>
  </div>

  <!-- fire alarm (from the alarm's sound) -->
  <div class="fire hidden" id="fire" role="alert">
    <div class="bell" id="fireIcon"></div>
    <div>
      <h2>FIRE ALARM</h2><h3>FEUERALARM</h3>
      <p>Leave the room now. Use the stairs, not the lift. Go to the assembly point.</p>
      <p class="de">Raum sofort verlassen. Treppe benutzen, nicht den Aufzug. Zum Sammelplatz gehen.</p>
      <div class="src" id="fireSrc"></div>
    </div>
  </div>

  <!-- emergency -->
  <div class="modal hidden" id="sosAsk" role="alertdialog" aria-modal="true" aria-labelledby="sosAskTitle">
    <div class="mcard">
      <span class="label kicker" id="sosAskKicker"></span>
      <h2 id="sosAskTitle" data-t="sos_ask"></h2>
      <p class="lead" data-t="sos_ask_lead"></p>
      <div class="row"><button class="btn line" id="sosNo" data-t="cancel"></button><button class="btn danger" id="sosYes" data-t="sos_yes"></button></div>
    </div>
  </div>
  <div class="modal hidden" id="sosOpen" role="alertdialog" aria-modal="true" aria-labelledby="sosOpenTitle">
    <div class="mcard">
      <span class="label kicker pulse" id="sosOpenKicker"></span>
      <h2 id="sosOpenTitle" data-t="sos_open"></h2>
      <p class="lead" id="sosOpenText"></p>
      <div class="row"><button class="btn line" id="sosHide" data-t="sos_hide"></button><button class="btn danger" id="sosEnd" data-t="sos_end"></button></div>
    </div>
  </div>
  <div class="banner hidden" id="sosBanner" role="alert"></div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const ROOM = params.get("room") || "Z.1.04";
  const TOKEN = params.get("token") || "";
  const API = `/api/display/${encodeURIComponent(ROOM)}`;
  const WATER_MIN = Math.max(1, Number(params.get("water")) || 45);   // reminder every N minutes of study
  const DEMO = params.get("demo") === "1";
  const BREAK_MIN = 5, BREAK_MAX = 30, BREAK_STEP = 5;
  const IDLE_MS = 90000;

  /* ---------- text (English / German, like the website) ---------- */
  const T = {
    en: {
      lang_btn: "DE", lang_aria: "Deutsch", sos: "SOS", sos_aria: "Emergency", back: "Back", done: "Done", cancel: "Cancel",
      prev: "Previous", next: "Next", open: "Open",
      state_label: "This room now",
      st_free: "Free", st_partial: "Shared", st_full: "Booked", st_ghost: "Booked", st_closed: "Closed", st_unbookable: "Open",
      st_break: "On break", ghost_sub: "Nobody here: the booking may be released soon.",
      people_0: "Nobody here right now.", people_1: "1 person here.", people_n: "{n} people here.",
      until: "Booked until {t}.", break_sub: "Held for the group until {t}.",
      water_in: "Next break reminder in {m} min", water_idle: "Break reminder every {m} min of study",
      t_book: "Book room", t_book_p: "QR code to reserve this room.",
      t_sound: "Sounds", t_sound_p: "Rain, ocean, forest, café and noise.", t_sound_on: "Playing: {s}.",
      t_sound_locked: "Only while the room is booked.", book_first: "Book first",
      t_selfie: "Selfie", t_selfie_p: "Group photo, download by QR code.",
      t_break: "Break", t_break_p: "Step out and keep the room.", t_break_on: "{m} min left.",

      const o = ctx.createOscillator(), g = ctx.createGain(), now = ctx.currentTime, base = 2200 + Math.random() * 1800, n = 2 + Math.floor(Math.random() * 3);
      o.frequency.setValueAtTime(base, now);
      for (let i = 0; i < n; i++) { o.frequency.linearRampToValueAtTime(base * (1.3 + Math.random() * 0.4), now + i * 0.12 + 0.05); o.frequency.linearRampToValueAtTime(base, now + i * 0.12 + 0.11); }
      g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.06, now + 0.02); g.gain.linearRampToValueAtTime(0, now + n * 0.12 + 0.05);
      o.connect(g).connect(master); o.start(now); o.stop(now + n * 0.12 + 0.1);
    }
    function burst(freq, q, peak, dur) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf("white");
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(), now = ctx.currentTime;
      g.gain.setValueAtTime(peak, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(f).connect(g).connect(master); src.start(now, Math.random() * 3); src.stop(now + dur + 0.02);
    }
    // a cup or spoon: a few inharmonic partials that ring briefly
    function clink(level = 0.03) {
      const now = ctx.currentTime, base = 2200 + Math.random() * 2200;
      [1, 2.76, 5.4].forEach((m, k) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = base * m;
        g.gain.setValueAtTime(level / (k + 1), now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35 / (k + 1));
        o.connect(g).connect(master); o.start(now); o.stop(now + 0.4);
      });
      if (Math.random() < 0.4) setTimeout(() => clink(level * 0.6), 90 + Math.random() * 120);   // spoon tapping twice
    }
    // one voice in the background: noise shaped by two "vowel" formants, switched on and off in syllables
    function voice() {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf("pink"); src.loop = true;
      const f1 = ctx.createBiquadFilter(), f2 = ctx.createBiquadFilter(), mix = ctx.createGain(), g = ctx.createGain();
      f1.type = f2.type = "bandpass"; f1.Q.value = 6; f2.Q.value = 8;
      g.gain.value = 0;
      src.connect(f1).connect(mix); src.connect(f2).connect(mix); mix.connect(g).connect(master);
      src.start(0, Math.random() * 3); nodes.push(src, f1, f2, mix, g);
      const level = 1.1 + Math.random() * 0.9, pitch = 0.8 + Math.random() * 0.5;   // narrow filters pass little energy
      let talking = Math.random() < 0.5;
      every(110, 320, () => {
        const now = ctx.currentTime;
        if (Math.random() < 0.04) talking = !talking;                      // a sentence ends, someone else talks
        f1.frequency.setTargetAtTime((300 + Math.random() * 500) * pitch, now, 0.03);
        f2.frequency.setTargetAtTime((900 + Math.random() * 1500) * pitch, now, 0.03);
        g.gain.setTargetAtTime(talking && Math.random() < 0.8 ? level * (0.5 + Math.random() * 0.5) : 0, now, 0.04);
      });
    }
    const presets = {
      rain() { noise("pink", "highpass", 400, 0.5, 0.55); noise("white", "bandpass", 3500, 0.9, 0.06); every(25, 140, () => burst(2500 + Math.random() * 3000, 3, 0.05, 0.03)); },
      // slow swell and hiss every ~12 s, low rumble underneath
      ocean() { const n = noise("brown", "lowpass", 500, 0.7, 0.3); lfo(n.g.gain, 0.08, 0.28); lfo(n.f.frequency, 0.08, 400); const h = noise("white", "highpass", 2500, 0.5, 0.02); lfo(h.g.gain, 0.08, 0.02); },
      forest() { noise("pink", "bandpass", 1400, 0.6, 0.3); noise("brown", "lowpass", 400, 0.7, 0.25); every(700, 2600, chirp); },
      // a room full of people: several murmuring voices, cups and spoons, the odd hiss of the coffee machine
      cafe() { noise("brown", "lowpass", 200, 0.7, 0.025); for (let k = 0; k < 7; k++) voice(); every(700, 2600, () => clink()); every(9000, 20000, () => burst(5000, 0.6, 0.05, 2.5)); },
      white() { noise("white", "lowpass", 9000, 0.7, 0.3); },
      pink() { noise("pink", "lowpass", 9000, 0.7, 0.45); },
      brown() { noise("brown", "lowpass", 1200, 0.7, 0.55); }
    };
    function stop() {
      nodes.forEach((n) => { try { n.stop && n.stop(); } catch {} try { n.disconnect(); } catch {} });
      timers.forEach((tm) => { tm.alive = false; clearTimeout(tm.id); }); nodes = []; timers = [];
    }
    return {
      apply({ kind, volume }) {
        if (kind === "off" || !presets[kind]) { stop(); playing = "off"; return; }
        ensure();
        if (kind !== playing) {
          stop(); playing = kind;
          master.gain.cancelScheduledValues(ctx.currentTime);
          master.gain.setValueAtTime(0, ctx.currentTime);
          master.gain.linearRampToValueAtTime(volume / 100, ctx.currentTime + 0.8);
          presets[kind]();
        } else {
          master.gain.setTargetAtTime(volume / 100, ctx.currentTime, 0.05);
        }
      },
      // browsers keep audio paused until someone touches the page; a sound picked up from the backend before that
      // is "on" but silent. audible() tells the two apart, resume() is called on every touch.
      audible() { return !!ctx && ctx.state === "running" && playing !== "off"; },
      resume() { if (ctx && ctx.state !== "running") ctx.resume(); },
      get output() { return master; }, get context() { return ctx; }
    };
  })();
  ["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => Synth.resume(), true));

  const soundsEl = $("sounds");
  SOUND_KINDS.forEach((k) => {
    const b = document.createElement("button");
    b.className = "snd"; b.dataset.kind = k;
    // tapping the playing sound stops it, but only if it can really be heard; otherwise the tap starts it
    b.addEventListener("click", () => setSound({ kind: k === sound.kind && k !== "off" && Synth.audible() ? "off" : k, volume: sound.volume }));
    soundsEl.appendChild(b);
  });
  let soundPostT;
  function setSound(next) {
    sound = next; soundLocalAt = Date.now();
    Synth.apply(sound); renderSound(); renderRing();
    clearTimeout(soundPostT);
    soundPostT = setTimeout(() => api("POST", "/sound", sound).catch(fail), 250);
  }
  function renderSound() {
    [...soundsEl.children].forEach((b) => {
      const k = b.dataset.kind, on = k === sound.kind;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      const html = `${ic(k)}<div><span>${t("s_" + k)}</span>${on && k !== "off" ? `<small>${t("playing")}</small>` : ""}</div>`;
      if (b.dataset.html !== html) { b.dataset.html = html; b.innerHTML = html; }
    });
    $("volVal").textContent = sound.volume + "%";
    $("volDown").disabled = sound.volume <= 0; $("volUp").disabled = sound.volume >= 100;
  }
  const vol = (d) => setSound({ kind: sound.kind, volume: Math.max(0, Math.min(100, sound.volume + d)) });
  $("volDown").addEventListener("click", () => vol(-10));
  $("volUp").addEventListener("click", () => vol(10));

  /* ---------- selfie (this computer's webcam; the board camera if there is none) ---------- */
  const video = $("video");
  let stream = null, countdownT = 0, useBoardCam = false;
  async function camStart() {
    useBoardCam = false;
    $("camNote").textContent = t("cam_starting"); $("camNote").classList.remove("hidden");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
      if (openSheet !== "selfie") { camStop(); return; }
      video.srcObject = stream; video.classList.remove("hidden"); $("camNote").classList.add("hidden");
    } catch {
      useBoardCam = true; video.classList.add("hidden");
      $("camNote").textContent = t("cam_none");
    }
  }
  function camStop() {
    if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; }
    video.srcObject = null;
  }
  function selfieReset() {
    clearInterval(countdownT); countdownT = 0;
    $("count").classList.add("hidden"); $("shot").classList.add("hidden");
    $("selfieCtrl").classList.remove("hidden"); $("selfieDone").classList.add("hidden");
    if (stream) video.classList.remove("hidden");
  }
  $("shoot").addEventListener("click", () => {
    if (countdownT) return;
    let n = 3; const c = $("count"); c.textContent = n; c.classList.remove("hidden");
    countdownT = setInterval(() => {
      n--; if (n > 0) { c.textContent = n; return; }
      clearInterval(countdownT); countdownT = 0; c.classList.add("hidden"); takeSelfie();
    }, 1000);
  });
  async function takeSelfie() {
    const fl = $("flash"); fl.classList.add("go"); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove("go")));
    let body;
    if (!useBoardCam && stream) {
      const cv = document.createElement("canvas"); cv.width = video.videoWidth || 640; cv.height = video.videoHeight || 480;
      // the live preview is mirrored like a mirror; the photo itself isn't, so text in it reads normally
      cv.getContext("2d").drawImage(video, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL("image/jpeg", 0.85);
      $("shot").src = data; $("shot").classList.remove("hidden"); video.classList.add("hidden");
      body = { image: data.split(",")[1] };
    }
    try {
      const r = await api("POST", "/selfie", body);
      $("selfieQr").innerHTML = r.qr_svg;   // SVG made by our own backend (segno)
      $("selfieExp").textContent = t("selfie_exp", { t: hhmm(parseLocal(r.expires_at)) });
      $("selfieCtrl").classList.add("hidden"); $("selfieDone").classList.remove("hidden");
    } catch (e) {
      toast(t("selfie_fail", { e: errText(e) }));
      selfieReset();
    }
  }
  $("retake").addEventListener("click", selfieReset);

  /* ---------- break ---------- */
  let breakMinutes = 15;
  $("bDown").addEventListener("click", () => { breakMinutes = Math.max(BREAK_MIN, breakMinutes - BREAK_STEP); renderBreak(); });
  $("bUp").addEventListener("click", () => { breakMinutes = Math.min(BREAK_MAX, breakMinutes + BREAK_STEP); renderBreak(); });
  async function startBreak(minutes) {
    try { const r = await api("POST", "/break", { minutes }); if (S) S.break_until = r.break_until; render(); }
    catch (e) { fail(e); }
  }
  $("bStart").addEventListener("click", () => startBreak(breakMinutes));
  $("bMore").addEventListener("click", () => {
    const brk = breakUntil(); if (!brk) return;
    startBreak(Math.min(BREAK_MAX, Math.ceil((brk - new Date()) / 60000) + 5));
  });
  $("bBack").addEventListener("click", async () => {
    try { await api("DELETE", "/break"); if (S) S.break_until = null; render(); } catch (e) { fail(e); }
  });
  function renderBreak() {
    $("bMin").textContent = breakMinutes;
    $("bBackBy").textContent = t("back_by", { t: hhmm(new Date(Date.now() + breakMinutes * 60000)) });
    $("bDown").disabled = breakMinutes <= BREAK_MIN; $("bUp").disabled = breakMinutes >= BREAK_MAX;
    const brk = breakUntil();
    $("breakSetup").classList.toggle("hidden", !!brk); $("breakActive").classList.toggle("hidden", !brk);
    if (brk) {
      const left = Math.max(0, Math.round((brk - new Date()) / 1000));
      $("bLeft").textContent = `${pad2(Math.floor(left / 60))}:${pad2(left % 60)}`;
      $("bUntil").textContent = t("back_by", { t: hhmm(brk) });
      $("bMore").disabled = Math.ceil(left / 60) + 5 > BREAK_MAX;
    }
  }
  setInterval(() => { if (openSheet === "break") renderBreak(); }, 1000);

  /* ---------- break reminder: every WATER_MIN minutes while people study here ---------- */
  let studySince = null, lastRemind = null, remindHideT = 0;
  function studyTick() {
    const studying = S && !breakUntil() && ((S.people || 0) > 0 || (S.bookings_now || []).length > 0);
    const now = Date.now();
    if (!studying) { studySince = null; lastRemind = null; }
    else if (studySince === null) { studySince = now; lastRemind = now; }
    if (studying && now - lastRemind >= WATER_MIN * 60000) { lastRemind = now; showReminder(); }
  }
  function waterText() {
    if (lastRemind === null) return t("water_idle", { m: WATER_MIN });
    return t("water_in", { m: Math.max(1, Math.ceil((lastRemind + WATER_MIN * 60000 - Date.now()) / 60000)) });
  }
  function showReminder(seconds = 60) {
    $("remindTitle").textContent = t("remind_title");
    $("remindText").textContent = t("remind_text", { m: WATER_MIN });
    const tl = $("remindTimeline"); tl.style.animation = "none"; void tl.offsetWidth; tl.style.animation = `shrink ${seconds}s linear forwards`;
    $("remind").classList.remove("hidden");
    clearTimeout(remindHideT); remindHideT = setTimeout(() => $("remind").classList.add("hidden"), seconds * 1000);
  }
  $("remind").addEventListener("pointerdown", () => { clearTimeout(remindHideT); $("remind").classList.add("hidden"); });

  /* ---------- fire alarm from the alarm's sound ----------
     Smoke alarms beep at about 3 kHz (EN 14604 / ISO 8201: three 0.5 s beeps, then a pause). Every 50 ms the page
     looks at the microphone's spectrum: a beep = a narrow peak between 2.5 and 4 kHz that stands 25 dB above the rest.
     Three beeps of 0.2-1.2 s within 6 s (or one tone longer than 3 s) = alarm. It stays up until no beep for 20 s.
     Nothing is recorded or sent: only the band energy is looked at, in this window. */
  const Alarm = (() => {
    let ctx, an, buf, on = false, onAt = 0, beeps = [], lastTone = 0, active = false, timer = 0;
    async function start(stream) {
      try {
        stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      } catch { $("ear").classList.add("hidden"); return; }
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      an = ctx.createAnalyser(); an.fftSize = 4096; an.smoothingTimeConstant = 0;
      ctx.createMediaStreamSource(stream).connect(an);
      buf = new Float32Array(an.frequencyBinCount);
      $("ear").innerHTML = ic("ear"); $("ear").classList.remove("hidden");
      const resume = () => { if (ctx.state === "suspended") ctx.resume(); };
      resume(); addEventListener("pointerdown", resume);
      clearInterval(timer); timer = setInterval(listen, 50);
    }
    function listen() {
      an.getFloatFrequencyData(buf);
      const hz = ctx.sampleRate / an.fftSize, lo = Math.round(2500 / hz), hi = Math.round(4000 / hz);
      let peak = -Infinity;
      for (let i = lo; i <= hi; i++) if (buf[i] > peak) peak = buf[i];
      const ref = [...buf.slice(Math.round(300 / hz), Math.round(8000 / hz))].sort((a, b) => a - b);
      const median = ref[ref.length >> 1];
      const tone = peak > -70 && peak - median > 25;
      const now = performance.now();
      if (tone) {
        lastTone = now;
        if (!on) { on = true; onAt = now; }
        if (now - onAt > 3000) raise();
      } else if (on) {
        on = false;
        const len = now - onAt;
        if (len >= 200 && len <= 1200) {
          beeps = beeps.filter((b) => now - b < 6000); beeps.push(now);
          if (beeps.length >= 3) raise();
        }
      }
      if (active && now - lastTone > 20000) clear();
    }
    function raise() {
      if (active) return;
      active = true;
      $("fireSrc").innerHTML = ic("ear") + t("fire_src", { t: hhmm(new Date()) });
      $("fire").classList.remove("hidden");
    }
    function clear() { active = false; beeps = []; $("fire").classList.add("hidden"); }
    return { start, raise, clear, get active() { return active; } };
  })();
  $("fireIcon").innerHTML = ic("bell");

  /* ---------- emergency ---------- */
  let sosHidden = null;
  $("sos").addEventListener("click", () => { $("sosAsk").classList.remove("hidden"); $("sosNo").focus(); });
  $("sosNo").addEventListener("click", () => { $("sosAsk").classList.add("hidden"); $("sos").focus(); });
  $("sosYes").addEventListener("click", async () => {
    $("sosAsk").classList.add("hidden");
    try { const em = await api("POST", "/emergency", { confirm: true }); if (S) S.emergency = em; sosHidden = null; renderEmergency(); }
    catch (e) { fail(e); }
  });
  $("sosHide").addEventListener("click", () => { sosHidden = S && S.emergency && S.emergency.id; renderEmergency(); });
  $("sosEnd").addEventListener("click", async () => {
    try { await api("DELETE", "/emergency"); if (S) S.emergency = null; renderEmergency(); $("sos").focus(); }
    catch (e) { fail(e); }
  });
  // the simulated call: "Calling the police (133)…" for a few seconds, then "Police called"
  const CALL_MS = 4000;
  let sosCalled = false;
  setInterval(() => { if (S && S.emergency && !sosCalled) renderEmergency(); }, 500);
  function renderEmergency() {
    const em = S && S.emergency;
    const at = em ? hhmm(parseLocal(em.created_at)) : "";
    sosCalled = !em || Date.now() - parseLocal(em.created_at) >= CALL_MS;
    $("sosOpen").classList.toggle("hidden", !em || sosHidden === em.id);
    $("sosBanner").classList.toggle("hidden", !em || sosHidden !== em.id);
    if (em) {
      $("sosOpenTitle").textContent = t(sosCalled ? "sos_open" : "sos_calling");
      $("sosOpenText").textContent = sosCalled ? t("sos_open_text", { t: at }) : t("sos_calling_text");
      $("sosHide").disabled = $("sosEnd").disabled = !sosCalled;
      $("sosBanner").innerHTML = ic("phone") + t("sos_banner", { t: at });
    }
  }

  /* ---------- static text + language ---------- */
  function applyText() {
    document.documentElement.lang = lang;
    $("lang").textContent = t("lang_btn"); $("lang").setAttribute("aria-label", t("lang_aria"));
    $("sos").innerHTML = ic("alert") + t("sos"); $("sos").setAttribute("aria-label", t("sos_aria"));
    $("prev").innerHTML = ic("left"); $("prev").setAttribute("aria-label", t("prev"));
    $("next").innerHTML = ic("right"); $("next").setAttribute("aria-label", t("next"));
    $("ear").setAttribute("aria-label", t("ear")); $("ear").title = t("ear");
    document.querySelectorAll("[data-back]").forEach((b) => { if (!b.dataset.t) b.innerHTML = ic("left") + t("back"); });
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
    $("shoot").innerHTML = ic("camera") + t("shoot");
    $("retake").textContent = t("retake");
    $("bStart").innerHTML = t("start_break") + ic("arrow");
    $("bMore").textContent = t("more5"); $("bBack").innerHTML = ic("check") + t("im_back");
    $("bDown").setAttribute("aria-label", t("minus")); $("bUp").setAttribute("aria-label", t("plus"));
    $("volDown").setAttribute("aria-label", t("vol_down")); $("volUp").setAttribute("aria-label", t("vol_up"));
    $("sosAskKicker").innerHTML = ic("alert") + t("sos_kicker"); $("sosOpenKicker").innerHTML = ic("phone") + t("sos_open_kicker");
    $("remindIcon").innerHTML = ic("drop");
    clock(); renderRing(); renderSound(); renderBreak();
    if (S) render();
  }
  $("lang").addEventListener("click", () => {
    lang = lang === "en" ? "de" : "en";
    try { localStorage.setItem("roomv-lang", lang); } catch {}
    applyText();
  });

  /* ---------- keyboard ---------- */
  addEventListener("keydown", (e) => {
    if (!$("sosAsk").classList.contains("hidden")) { if (e.key === "Escape") $("sosNo").click(); return; }
    if (openSheet) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") scrollByCards(1);
    else if (e.key === "ArrowLeft") scrollByCards(-1);
    if (DEMO && (e.key === "w" || e.key === "W")) showReminder(15);
    if (DEMO && (e.key === "f" || e.key === "F")) { Alarm.raise(); setTimeout(() => Alarm.clear(), 15000); }
  });

  /* ---------- back home (room card in the middle) after 90 s without a touch ---------- */
  let lastTouch = Date.now();
  ["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => { lastTouch = Date.now(); }, true));
  setInterval(() => {
    if (Date.now() - lastTouch < IDLE_MS || countdownT || !$("sosAsk").classList.contains("hidden")) return;
    if (openSheet) closeSheet();
    strip.scrollTo({ left: 0, behavior: "smooth" });
    lastTouch = Date.now();
  }, 5000);

  /* ---------- go ---------- */
  applyText();
  poll(); setInterval(poll, 1500);
  Alarm.start();
  window.roomDisplay = { showReminder, Alarm, Synth, scrollByCards };   // for demos and tests
})();
</script>
</body>

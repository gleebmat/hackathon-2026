<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room display</title>
<!--
  The board room's touch display (app/display.py opens it as a small window: /display.html?room=Z.1.04&token=...).
  Laid out for the Infineon E84 kit's 4.3" 800x480 panel and scaled to whatever window it gets.
  Home: two tiles left, two right, the room's status in the middle. AAU colours (blue and white, taken from the
  university logo), Barlow Condensed headings, Atkinson Hyperlegible text (made for low-vision readers).
  Shown without a button: a water-and-stretch reminder every 45 minutes of study, and a fire-alarm alert for deaf
  students when the microphone hears a smoke alarm's beeps (~3 kHz, three beeps in a row). Sound is analysed in the
  page and never recorded or sent.
  URL options: room, token, water=<minutes> (default 45), demo=1 (keys W = water reminder, F = fire alarm test).
  API: docs/PLAN.md, "Room display".
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  :root {
    --aau: #497284;          /* AAU dark blue (logo) */
    --aau-light: #57a0c7;    /* AAU light blue (logo) */
    --aau-deep: #2f4f5e;     /* darker shade for pressed states and small text on light blue */
    --wash: #eef5f9;         /* page background: a whisper of the light blue */
    --white: #ffffff; --line: #cfe0ea; --text: #1d2a31; --muted: #51626c;
    --free: #1f7a4a; --shared: #a15c00; --full: #b3261e; --ghost: #6247c4; --closed: #6b7780; --break: #a15c00;
    --sos: #c62828; --focus: #f2a900;
    --head: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Atkinson Hyperlegible", Verdana, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1d2a31; overflow: hidden; }
  body { font-family: var(--body); color: var(--text); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  button:disabled { opacity: .35; cursor: default; }
  .hidden { display: none !important; }
  svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .h { font-family: var(--head); font-weight: 600; letter-spacing: .01em; }
  .caps { font-family: var(--head); font-weight: 600; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; }

  #screen { position: absolute; left: 0; top: 0; width: 800px; height: 480px; transform-origin: 0 0;
            background: var(--wash); overflow: hidden; user-select: none; -webkit-user-select: none; }

  /* top bar: white, logo, room, date + time, SOS */
  .bar { height: 72px; background: var(--white); display: flex; align-items: center; gap: 14px; padding: 0 12px 0 18px;
         border-bottom: 4px solid var(--aau-light); }
  .logo { height: 40px; display: flex; align-items: center; flex: none; }
  .logo img { height: 40px; width: auto; display: block; }
  .logo .word { font-family: var(--head); font-weight: 600; font-size: 16px; line-height: 1.05; letter-spacing: .08em; text-transform: uppercase; color: var(--aau); }
  .logo .word span { display: block; color: var(--aau-light); }
  .vr { width: 1px; height: 36px; background: var(--line); flex: none; }
  .roomid { font-family: var(--head); font-weight: 700; font-size: 32px; color: var(--aau); flex: 1; min-width: 0; white-space: nowrap; }
  .when { text-align: right; line-height: 1.05; flex: none; }
  .when b { display: block; font-family: var(--head); font-weight: 600; font-size: 28px; color: var(--text); font-variant-numeric: tabular-nums; }
  .when span { font-size: 15px; color: var(--muted); }
  .ear { font-size: 24px; color: var(--aau); flex: none; display: grid; place-items: center; width: 28px; }
  .langbtn { height: 48px; min-width: 52px; padding: 0 10px; border-radius: 8px; border: 2px solid var(--line); font-family: var(--head); font-weight: 600; font-size: 19px; color: var(--aau); }
  .sos { height: 52px; padding: 0 18px; border-radius: 8px; background: var(--sos); color: #fff; font-family: var(--head); font-weight: 700;
         font-size: 24px; letter-spacing: .08em; display: inline-flex; align-items: center; gap: 8px; }
  .sos svg { font-size: 22px; }

  /* home: tile | status panel | tile */
  #home { position: absolute; top: 72px; left: 0; right: 0; bottom: 0; padding: 16px; display: grid;
          grid-template-columns: 228px 1fr 228px; grid-template-rows: 1fr 1fr; gap: 16px; }
  .tile { background: var(--white); border: 1px solid var(--line); border-bottom: 5px solid var(--aau-light); border-radius: 10px;
          padding: 16px 18px 14px; text-align: left; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .tile:active { background: #f4f9fc; }
  .tile .icon { width: 50px; height: 50px; border-radius: 12px; background: var(--wash); color: var(--aau); display: grid; place-items: center; font-size: 28px; }
  .tile h2 { font-family: var(--head); font-weight: 700; font-size: 30px; line-height: 1; margin: 14px 0 6px; color: var(--text); }
  .tile p { margin: 0; font-size: 16px; line-height: 1.3; color: var(--muted); }
  .tile .go { position: absolute; right: 16px; top: 22px; font-size: 24px; color: var(--aau-light); }
  .tile.l1 { grid-column: 1; grid-row: 1; } .tile.l2 { grid-column: 1; grid-row: 2; }
  .tile.r1 { grid-column: 3; grid-row: 1; } .tile.r2 { grid-column: 3; grid-row: 2; }

  .panel { grid-column: 2; grid-row: 1 / span 2; background: var(--aau); color: var(--white); border-radius: 10px; padding: 18px 22px;
           display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .panel .caps { color: #e7f2f8; font-size: 16px; }
  .state { display: flex; align-items: center; gap: 12px; }
  .state .dot { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; flex: none; }
  .state b { font-family: var(--head); font-weight: 700; font-size: 52px; line-height: 1; }
  .panel .sub { font-size: 18px; line-height: 1.35; color: #e7f2f8; margin: 0; }
  .panel hr { border: 0; border-top: 1px solid rgb(255 255 255 / 28%); margin: 4px 0; width: 100%; }
  .quiet { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; text-align: left; }
  .quiet .t { font-family: var(--head); font-weight: 600; font-size: 24px; display: block; }
  .quiet small { display: block; font-size: 15px; color: #e7f2f8; }
  .switch { width: 66px; height: 38px; border-radius: 19px; background: rgb(255 255 255 / 25%); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%; background: #fff; transition: left .2s; }
  .quiet[aria-checked="true"] .switch { background: var(--aau-light); }
  .quiet[aria-checked="true"] .switch::after { left: 32px; }
  .water { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #e7f2f8; margin-top: auto; }
  .water svg { font-size: 22px; color: #bfe0f1; }

  /* feature sheets */
  .sheet { position: absolute; top: 72px; left: 0; right: 0; bottom: 0; padding: 0 18px 18px; display: flex; flex-direction: column; background: var(--wash); }
  .sheet-head { height: 80px; flex: none; display: flex; align-items: center; gap: 16px; }
  .back { height: 54px; padding: 0 18px 0 10px; border-radius: 8px; background: var(--white); border: 2px solid var(--line); font-family: var(--head); font-weight: 600; font-size: 22px; color: var(--aau); display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .back svg { font-size: 26px; }
  .sheet-head h2 { margin: 0; font-family: var(--head); font-weight: 700; font-size: 38px; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-body { flex: 1; min-height: 0; display: flex; gap: 24px; align-items: stretch; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; }
  .lead { font-size: 21px; line-height: 1.4; margin: 0; color: var(--text); }
  .small { font-size: 16px; color: var(--muted); margin: 0; overflow-wrap: anywhere; line-height: 1.35; }
  .btn { height: 64px; border-radius: 8px; font-family: var(--head); font-weight: 700; font-size: 25px; letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 22px; }
  .btn svg { font-size: 24px; }
  .btn.blue { background: var(--aau); color: #fff; }
  .btn.line { background: var(--white); border: 2px solid var(--line); color: var(--aau); }
  .btn.go { background: var(--free); color: #fff; }
  .round { width: 60px; height: 60px; border-radius: 50%; background: var(--white); border: 2px solid var(--line); color: var(--aau); font-size: 30px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .qr { background: #fff; padding: 12px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; }
  .qr img, .qr svg { display: block; width: 100%; height: 100%; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

  /* sounds */
  .sounds { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 12px; }
  .snd { background: var(--white); border: 1px solid var(--line); border-bottom: 5px solid var(--line); border-radius: 10px; padding: 14px 16px 12px;
         text-align: left; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .snd svg { font-size: 34px; color: var(--aau-light); }
  .snd span { font-family: var(--head); font-weight: 700; font-size: 26px; line-height: 1; overflow-wrap: break-word; hyphens: auto; }
  .snd small { display: block; font-family: var(--head); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
  .snd[aria-pressed="true"] { background: var(--aau); color: #fff; border-color: var(--aau); border-bottom-color: var(--aau-light); }
  .snd[aria-pressed="true"] svg { color: #fff; }
  .vol { display: flex; align-items: center; gap: 8px; flex: none; }
  .vol output { width: 70px; text-align: center; font-family: var(--head); font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; }

  /* selfie */
  .cam { width: 380px; height: 285px; background: #13202a; position: relative; overflow: hidden; flex: none; border-radius: 10px; align-self: center; }
  .cam video, .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam video { transform: scaleX(-1); }
  .cam .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--head); font-weight: 700; font-size: 170px; color: #fff; text-shadow: 0 4px 30px #000a; }
  .cam .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .cam .flash.go { opacity: 1; transition: none; }
  .cam .camnote { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 36px; font-size: 18px; color: #cfe0ea; line-height: 1.4; }

  /* break */
  .numeral { font-family: var(--head); font-weight: 700; font-size: 120px; line-height: .9; color: var(--aau); font-variant-numeric: tabular-nums; }

  /* emergency */
  .modal { position: absolute; inset: 0; background: rgb(29 42 49 / 70%); display: grid; place-items: center; z-index: 10; }
  .mcard { width: 600px; background: var(--white); border-top: 8px solid var(--sos); border-radius: 10px; padding: 24px 32px 28px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 30px 60px -20px #000a; }
  .mcard .kicker { color: var(--sos); display: flex; align-items: center; gap: 8px; }
  .mcard h2 { margin: 0; font-family: var(--head); font-weight: 700; font-size: 40px; line-height: 1.05; }
  .mcard .row { display: flex; gap: 14px; margin-top: 6px; }
  .mcard .row .btn { flex: 1; }
  .btn.danger { background: var(--sos); color: #fff; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .banner { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: var(--sos); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 700; z-index: 5; }

  /* water + stretch reminder (no button: shows by itself, tap anywhere or wait to close) */
  .water-note { position: absolute; top: 72px; left: 0; right: 0; bottom: 0; background: #2e6d91; color: #fff; z-index: 8;
                display: flex; align-items: center; gap: 36px; padding: 0 56px; }
  .water-note .drop { font-size: 150px; flex: none; color: #bfe0f1; }
  .water-note .drop svg { stroke-width: 1.4; }
  .water-note h2 { font-family: var(--head); font-weight: 700; font-size: 58px; line-height: .95; margin: 0 0 14px; }
  .water-note p { font-size: 22px; line-height: 1.4; margin: 0; max-width: 470px; }
  .water-note .timeline { position: absolute; left: 0; bottom: 0; height: 8px; background: #fff; animation: shrink linear forwards; }
  @keyframes shrink { from { width: 100%; } to { width: 0; } }

  /* fire alarm (from the alarm's sound): big, bilingual, slow pulse (1 Hz, well under the 3 flashes/s seizure limit) */
  .fire { position: absolute; top: 72px; left: 0; right: 0; bottom: 0; z-index: 9; color: #fff; display: grid;
          grid-template-columns: 170px 1fr; align-items: center; gap: 26px; padding: 0 40px; animation: fire 1s steps(1) infinite; }
  @keyframes fire { 0% { background: #b71c1c; } 50% { background: #7f1010; } }
  .fire .bell { font-size: 150px; }
  .fire .bell svg { stroke-width: 1.6; }
  .fire h2 { font-family: var(--head); font-weight: 700; font-size: 66px; line-height: .9; margin: 0; letter-spacing: .02em; }
  .fire h3 { font-family: var(--head); font-weight: 600; font-size: 34px; line-height: 1; margin: 4px 0 14px; opacity: .9; }
  .fire p { font-size: 21px; line-height: 1.35; margin: 0 0 6px; }
  .fire p.de { opacity: .85; font-size: 18px; }
  .fire .src { margin-top: 12px; font-size: 15px; opacity: .8; display: flex; gap: 8px; align-items: center; }

  .toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: max-content; max-width: 680px; background: var(--text); color: #fff;
           font-size: 18px; line-height: 1.35; padding: 14px 22px; border-radius: 8px; z-index: 20; box-shadow: 0 14px 30px -12px #000a; text-align: center; }
  .offline { position: absolute; left: 0; right: 0; top: 72px; background: #ffe3a3; color: var(--text); font-size: 16px; font-weight: 700; text-align: center; padding: 6px; z-index: 6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .fire { background: #b71c1c; }
  }
</style>
</head>
<body>
<div id="screen">
  <header class="bar">
    <div class="logo" id="logo"><img src="img/aau-logo.svg" alt="Universität Klagenfurt" id="logoImg"></div>
    <span class="vr"></span>
    <span class="roomid" id="label">Room</span>
    <span class="ear hidden" id="ear" role="img"></span>
    <div class="when" aria-hidden="true"><b id="clock">--:--</b><span id="date"></span></div>
    <button class="langbtn" id="lang"></button>
    <button class="sos" id="sos"></button>
  </header>

  <div class="offline hidden" id="offline" role="alert"></div>

  <main id="home">
    <button class="tile l1" data-open="book"></button>
    <button class="tile l2" data-open="sound"></button>
    <section class="panel" aria-labelledby="stateLabel">
      <span class="caps" id="stateLabel"></span>
      <div class="state"><span class="dot" id="dot"></span><b id="stateText">…</b></div>
      <p class="sub" id="stateSub"></p>
      <hr>
      <button class="quiet" id="quiet" role="switch" aria-checked="false">
        <span><span class="t" id="quietT"></span><small id="quietS"></small></span><span class="switch" aria-hidden="true"></span>
      </button>
      <div class="water" id="waterLine"></div>
    </section>
    <button class="tile r1" data-open="selfie"></button>
    <button class="tile r2" data-open="break"></button>
  </main>

  <!-- book -->
  <section class="sheet hidden" id="sheet-book" aria-labelledby="h-book">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-book" data-t="book_title"></h2></div>
    <div class="sheet-body">
      <div class="qr" style="width:300px;height:300px;align-self:center"><img id="bookQr" alt=""></div>
      <div class="col card" style="justify-content:center">
        <p class="lead" data-t="book_lead"></p>
        <span class="caps" style="color:var(--aau);margin-top:6px" data-t="book_now_label"></span>
        <p class="h" style="font-size:38px;margin:-8px 0 0;color:var(--text)" id="bookNow"></p>
        <p class="small" id="bookUrl"></p>
      </div>
    </div>
  </section>

  <!-- soundscapes -->
  <section class="sheet hidden" id="sheet-sound" aria-labelledby="h-sound">
    <div class="sheet-head">
      <button class="back" data-back></button><h2 id="h-sound" data-t="sound_title"></h2>
      <div class="vol" role="group"><button class="round" id="volDown">−</button><output id="volVal" aria-live="polite"></output><button class="round" id="volUp">+</button></div>
    </div>
    <div class="sounds" id="sounds"></div>
  </section>

  <!-- selfie -->
  <section class="sheet hidden" id="sheet-selfie" aria-labelledby="h-selfie">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-selfie" data-t="selfie_title"></h2></div>
    <div class="sheet-body">
      <div class="cam" id="cam">
        <video id="video" autoplay playsinline muted></video>
        <img id="shot" class="hidden" alt="">
        <div class="camnote hidden" id="camNote"></div>
        <div class="count hidden" id="count" aria-live="assertive"></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="col card" id="selfieCtrl" style="justify-content:space-between">
        <p class="lead" data-t="selfie_lead"></p>
        <button class="btn blue" style="height:76px" id="shoot"></button>
      </div>
      <div class="col card hidden" id="selfieDone" style="align-items:center;gap:10px;padding:16px 18px">
        <div class="qr" style="width:170px;height:170px;padding:8px" id="selfieQr"></div>
        <p class="small" style="text-align:center;color:var(--text)" id="selfieExp"></p>
        <div style="display:flex;gap:10px;width:100%;margin-top:auto">
          <button class="btn line" style="flex:1;height:58px" id="retake"></button>
          <button class="btn blue" style="flex:1;height:58px" data-back data-t="done"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- break -->
  <section class="sheet hidden" id="sheet-break" aria-labelledby="h-break">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-break" data-t="break_title"></h2></div>
    <div class="sheet-body" id="breakSetup">
      <div class="card" style="width:330px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
        <div class="numeral" id="bMin" aria-live="polite"></div>
        <div style="display:flex;gap:16px;align-items:center">
          <button class="round" style="width:72px;height:72px;font-size:34px" id="bDown">−</button>
          <span class="caps" style="width:100px;text-align:center;color:var(--muted)" data-t="minutes_label"></span>
          <button class="round" style="width:72px;height:72px;font-size:34px" id="bUp">+</button>
        </div>
      </div>
      <div class="col card" style="justify-content:space-between">
        <div style="display:flex;flex-direction:column;gap:10px">
          <p class="lead" data-t="break_lead"></p>
          <p class="small" id="bBackBy"></p>
        </div>
        <button class="btn blue" id="bStart"></button>
      </div>
    </div>
    <div class="sheet-body hidden card" id="breakActive" style="flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center">
      <span class="caps" style="color:var(--muted)" data-t="break_held"></span>
      <div class="numeral" style="font-size:130px" id="bLeft" role="timer"></div>
      <p class="lead" id="bUntil"></p>
      <div style="display:flex;gap:14px;margin-top:6px">
        <button class="btn line" style="min-width:170px" id="bMore"></button>
        <button class="btn go" style="min-width:230px" id="bBack"></button>
      </div>
    </div>
  </section>

  <!-- water + stretch reminder (shows by itself) -->
  <div class="water-note hidden" id="waterNote" role="status" aria-live="polite">
    <div class="drop" id="waterDrop"></div>
    <div><h2 id="waterTitle"></h2><p id="waterText"></p></div>
    <div class="timeline" id="waterTimeline"></div>
  </div>

  <!-- fire alarm (from the alarm's sound) -->
  <div class="fire hidden" id="fire" role="alert">
    <div class="bell" id="fireIcon"></div>
    <div>
      <h2>FIRE ALARM</h2><h3>FEUERALARM</h3>
      <p>Leave the room now. Use the stairs, not the lift. Go to the assembly point.</p>
      <p class="de">Raum sofort verlassen. Treppe benutzen, nicht den Aufzug. Zum Sammelplatz gehen.</p>
      <div class="src" id="fireSrc"></div>
    </div>
  </div>

  <!-- emergency -->
  <div class="modal hidden" id="sosAsk" role="alertdialog" aria-modal="true" aria-labelledby="sosAskTitle">
    <div class="mcard">
      <span class="caps kicker" id="sosAskKicker"></span>
      <h2 id="sosAskTitle" data-t="sos_ask"></h2>
      <p class="lead" style="font-size:20px" data-t="sos_ask_lead"></p>
      <div class="row"><button class="btn line" id="sosNo" data-t="cancel"></button><button class="btn danger" id="sosYes" data-t="sos_yes"></button></div>
    </div>
  </div>
  <div class="modal hidden" id="sosOpen" role="alertdialog" aria-modal="true" aria-labelledby="sosOpenTitle">
    <div class="mcard">
      <span class="caps kicker pulse" id="sosOpenKicker"></span>

  const Synth = (() => {

        if (type === "white") d[i] = w * 0.5;
        else if (type === "brown") { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
        else {

          d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
        }

    function noise(type, ftype, freq, q, gain) {

      const f = ctx.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(); g.gain.value = gain;

      return { f, g };
    }
    function lfo(param, rate, depth) {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = rate; g.gain.value = depth;
      o.connect(g).connect(param); o.start(); nodes.push(o, g);
    }
    function every(min, max, fn) {
      const tm = { alive: true };
      const tick = () => { if (!tm.alive) return; fn(); tm.id = setTimeout(tick, min + Math.random() * (max - min)); };
      tm.id = setTimeout(tick, Math.random() * min); timers.push(tm);
    }
    function chirp() {
      const o = ctx.createOscillator(), g = ctx.createGain(), now = ctx.currentTime, base = 2200 + Math.random() * 1800, n = 2 + Math.floor(Math.random() * 3);
      o.frequency.setValueAtTime(base, now);
      for (let i = 0; i < n; i++) { o.frequency.linearRampToValueAtTime(base * (1.3 + Math.random() * 0.4), now + i * 0.12 + 0.05); o.frequency.linearRampToValueAtTime(base, now + i * 0.12 + 0.11); }
      g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.06, now + 0.02); g.gain.linearRampToValueAtTime(0, now + n * 0.12 + 0.05);
      o.connect(g).connect(master); o.start(now); o.stop(now + n * 0.12 + 0.1);
    }
    function burst(freq, q, peak, dur) {
      const src = ctx.createBufferSource(); src.buffer = noiseBuf("white");
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(), now = ctx.currentTime;
      g.gain.setValueAtTime(peak, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(f).connect(g).connect(master); src.start(now, Math.random() * 3); src.stop(now + dur + 0.02);
    }
    function clink() {
      const o = ctx.createOscillator(), g = ctx.createGain(), now = ctx.currentTime;
      o.frequency.value = 2600 + Math.random() * 1600;
      g.gain.setValueAtTime(0.025, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      o.connect(g).connect(master); o.start(now); o.stop(now + 0.45);
    }
    const presets = {
      rain() { noise("pink", "highpass", 400, 0.5, 0.55); noise("white", "bandpass", 3500, 0.9, 0.06); every(25, 140, () => burst(2500 + Math.random() * 3000, 3, 0.05, 0.03)); },
      ocean() { const n = noise("brown", "lowpass", 600, 0.7, 0.35); lfo(n.g.gain, 0.08, 0.3); lfo(n.f.frequency, 0.08, 350); },
      forest() { noise("pink", "bandpass", 1400, 0.6, 0.3); noise("brown", "lowpass", 400, 0.7, 0.25); every(700, 2600, chirp); },
      cafe() { const n = noise("brown", "bandpass", 420, 1.1, 0.5); lfo(n.g.gain, 0.6, 0.12); noise("pink", "bandpass", 900, 2, 0.06); every(1800, 5000, clink); },
      white() { noise("white", "lowpass", 9000, 0.7, 0.3); },
      pink() { noise("pink", "lowpass", 9000, 0.7, 0.45); },
      brown() { noise("brown", "lowpass", 1200, 0.7, 0.55); }
    };
    function stop() {
      nodes.forEach((n) => { try { n.stop && n.stop(); } catch {} try { n.disconnect(); } catch {} });
      timers.forEach((tm) => { tm.alive = false; clearTimeout(tm.id); }); nodes = []; timers = [];
    }
    return {
      apply({ kind, volume }) {
        if (kind === "off" || !presets[kind]) { stop(); playing = "off"; return; }
        ensure();
        if (kind !== playing) {
          stop(); playing = kind;
          master.gain.cancelScheduledValues(ctx.currentTime);
          master.gain.setValueAtTime(0, ctx.currentTime);
          master.gain.linearRampToValueAtTime(volume / 100, ctx.currentTime + 0.8);
          presets[kind]();
        } else {
          master.gain.setTargetAtTime(volume / 100, ctx.currentTime, 0.05);
        }
      }
    };
  })();

  const soundsEl = $("sounds");
  SOUND_KINDS.forEach((k) => {
    const b = document.createElement("button");
    b.className = "snd"; b.dataset.kind = k;
    b.addEventListener("click", () => setSound({ kind: k === sound.kind ? "off" : k, volume: sound.volume }));
    soundsEl.appendChild(b);
  });
  let soundPostT;
  function setSound(next) {
    sound = next; soundLocalAt = Date.now();
    Synth.apply(sound); renderSound(); renderTiles();
    clearTimeout(soundPostT);
    soundPostT = setTimeout(() => api("POST", "/sound", sound).catch(fail), 250);
  }
  function renderSound() {
    [...soundsEl.children].forEach((b) => {
      const k = b.dataset.kind, on = k === sound.kind;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      const html = `${ic(k)}<div><span>${t("s_" + k)}</span>${on && k !== "off" ? `<small>${t("playing")}</small>` : ""}</div>`;
      if (b.dataset.html !== html) { b.dataset.html = html; b.innerHTML = html; }
    });
    $("volVal").textContent = sound.volume + "%";
    $("volDown").disabled = sound.volume <= 0; $("volUp").disabled = sound.volume >= 100;
  }
  const vol = (d) => setSound({ kind: sound.kind, volume: Math.max(0, Math.min(100, sound.volume + d)) });
  $("volDown").addEventListener("click", () => vol(-10));
  $("volUp").addEventListener("click", () => vol(10));

  /* ---------- selfie (this computer's webcam; the board camera if there is none) ---------- */
  const video = $("video");
  let stream = null, countdownT = 0, useBoardCam = false;
  async function camStart() {
    useBoardCam = false;
    $("camNote").textContent = t("cam_starting"); $("camNote").classList.remove("hidden");
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
      if (openSheet !== "selfie") { camStop(); return; }
      video.srcObject = stream; video.classList.remove("hidden"); $("camNote").classList.add("hidden");
    } catch {
      useBoardCam = true; video.classList.add("hidden");
      $("camNote").textContent = t("cam_none");
    }
  }
  function camStop() {
    if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; }
    video.srcObject = null;
  }
  function selfieReset() {
    clearInterval(countdownT); countdownT = 0;
    $("count").classList.add("hidden"); $("shot").classList.add("hidden");
    $("selfieCtrl").classList.remove("hidden"); $("selfieDone").classList.add("hidden");
    if (stream) video.classList.remove("hidden");
  }
  $("shoot").addEventListener("click", () => {
    if (countdownT) return;
    let n = 3; const c = $("count"); c.textContent = n; c.classList.remove("hidden");
    countdownT = setInterval(() => {
      n--; if (n > 0) { c.textContent = n; return; }
      clearInterval(countdownT); countdownT = 0; c.classList.add("hidden"); takeSelfie();
    }, 1000);
  });
  async function takeSelfie() {
    const fl = $("flash"); fl.classList.add("go"); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove("go")));
    let body;
    if (!useBoardCam && stream) {
      const cv = document.createElement("canvas"); cv.width = video.videoWidth || 640; cv.height = video.videoHeight || 480;
      // the live preview is mirrored like a mirror; the photo itself isn't, so text in it reads normally
      cv.getContext("2d").drawImage(video, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL("image/jpeg", 0.85);
      $("shot").src = data; $("shot").classList.remove("hidden"); video.classList.add("hidden");
      body = { image: data.split(",")[1] };
    }
    try {
      const r = await api("POST", "/selfie", body);
      $("selfieQr").innerHTML = r.qr_svg;   // SVG made by our own backend (segno)
      $("selfieExp").textContent = t("selfie_exp", { t: hhmm(parseLocal(r.expires_at)) });
      $("selfieCtrl").classList.add("hidden"); $("selfieDone").classList.remove("hidden");
    } catch (e) {
      toast(t("selfie_fail", { e: errText(e) }));
      selfieReset();
    }
  }
  $("retake").addEventListener("click", selfieReset);

  /* ---------- break ---------- */
  let breakMinutes = 15;
  $("bDown").addEventListener("click", () => { breakMinutes = Math.max(BREAK_MIN, breakMinutes - BREAK_STEP); renderBreak(); });
  $("bUp").addEventListener("click", () => { breakMinutes = Math.min(BREAK_MAX, breakMinutes + BREAK_STEP); renderBreak(); });
  async function startBreak(minutes) {
    try { const r = await api("POST", "/break", { minutes }); if (S) S.break_until = r.break_until; render(); }
    catch (e) { fail(e); }
  }
  $("bStart").addEventListener("click", () => startBreak(breakMinutes));
  $("bMore").addEventListener("click", () => {
    const brk = breakUntil(); if (!brk) return;
    startBreak(Math.min(BREAK_MAX, Math.ceil((brk - new Date()) / 60000) + 5));
  });
  $("bBack").addEventListener("click", async () => {
    try { await api("DELETE", "/break"); if (S) S.break_until = null; render(); } catch (e) { fail(e); }
  });
  function renderBreak() {
    $("bMin").textContent = breakMinutes;
    $("bBackBy").textContent = t("back_by", { t: hhmm(new Date(Date.now() + breakMinutes * 60000)) });
    $("bDown").disabled = breakMinutes <= BREAK_MIN; $("bUp").disabled = breakMinutes >= BREAK_MAX;
    const brk = breakUntil();
    $("breakSetup").classList.toggle("hidden", !!brk); $("breakActive").classList.toggle("hidden", !brk);
    if (brk) {
      const left = Math.max(0, Math.round((brk - new Date()) / 1000));
      $("bLeft").textContent = `${pad2(Math.floor(left / 60))}:${pad2(left % 60)}`;
      $("bUntil").textContent = t("back_by", { t: hhmm(brk) });
      $("bMore").disabled = Math.ceil(left / 60) + 5 > BREAK_MAX;
    }
  }
  setInterval(() => { if (openSheet === "break") renderBreak(); }, 1000);

  /* ---------- water + stretch reminder: every WATER_MIN minutes while people study here ---------- */
  let studySince = null, lastWater = null, waterHideT = 0;
  function studyTick() {
    const studying = S && !breakUntil() && ((S.people || 0) > 0 || (S.bookings_now || []).length > 0);
    const now = Date.now();
    if (!studying) { studySince = null; lastWater = null; }
    else if (studySince === null) { studySince = now; lastWater = now; }
    if (studying && now - lastWater >= WATER_MIN * 60000) { lastWater = now; showWater(); }
    const left = studying ? Math.max(1, Math.ceil((lastWater + WATER_MIN * 60000 - now) / 60000)) : null;
    $("waterLine").innerHTML = ic("drop") + `<span>${left ? t("water_in", { m: left }) : t("water_idle", { m: WATER_MIN })}</span>`;
  }
  function showWater(seconds = 60) {
    $("waterTitle").textContent = t("water_title");
    $("waterText").textContent = t("water_text", { m: WATER_MIN });
    const tl = $("waterTimeline"); tl.style.animation = "none"; void tl.offsetWidth; tl.style.animation = `shrink ${seconds}s linear forwards`;
    $("waterNote").classList.remove("hidden");
    clearTimeout(waterHideT); waterHideT = setTimeout(() => $("waterNote").classList.add("hidden"), seconds * 1000);
  }
  $("waterNote").addEventListener("pointerdown", () => { clearTimeout(waterHideT); $("waterNote").classList.add("hidden"); });

  /* ---------- fire alarm from the alarm's sound ----------
     Smoke alarms beep at about 3 kHz (EN 14604 / ISO 8201: three 0.5 s beeps, then a pause). Every 50 ms the page
     looks at the microphone's spectrum: a beep = a narrow peak between 2.5 and 4 kHz that stands 25 dB above the rest.
     Three beeps of 0.2-1.2 s within 6 s (or one tone longer than 3 s) = alarm. It stays up until no beep for 20 s.
     Nothing is recorded or sent: only the band energy is looked at, in this window. */
  const Alarm = (() => {
    let ctx, an, buf, on = false, onAt = 0, beeps = [], lastTone = 0, active = false, timer = 0;
    async function start(stream) {
      try {
        stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      } catch { $("ear").classList.add("hidden"); return; }
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      an = ctx.createAnalyser(); an.fftSize = 4096; an.smoothingTimeConstant = 0;
      ctx.createMediaStreamSource(stream).connect(an);
      buf = new Float32Array(an.frequencyBinCount);
      $("ear").innerHTML = ic("ear"); $("ear").classList.remove("hidden");
      const resume = () => { if (ctx.state === "suspended") ctx.resume(); };
      resume(); addEventListener("pointerdown", resume);
      clearInterval(timer); timer = setInterval(listen, 50);
    }
    function listen() {
      an.getFloatFrequencyData(buf);
      const hz = ctx.sampleRate / an.fftSize, lo = Math.round(2500 / hz), hi = Math.round(4000 / hz);
      let peak = -Infinity;
      for (let i = lo; i <= hi; i++) if (buf[i] > peak) peak = buf[i];
      const ref = [...buf.slice(Math.round(300 / hz), Math.round(8000 / hz))].sort((a, b) => a - b);
      const median = ref[ref.length >> 1];
      const tone = peak > -70 && peak - median > 25;
      const now = performance.now();
      if (tone) {
        lastTone = now;
        if (!on) { on = true; onAt = now; }
        if (now - onAt > 3000) raise();
      } else if (on) {
        on = false;
        const len = now - onAt;
        if (len >= 200 && len <= 1200) {
          beeps = beeps.filter((b) => now - b < 6000); beeps.push(now);
          if (beeps.length >= 3) raise();
        }
      }
      if (active && now - lastTone > 20000) clear();
    }
    function raise() {
      if (active) return;
      active = true;
      $("fireSrc").innerHTML = ic("ear") + t("fire_src", { t: hhmm(new Date()) });
      $("fire").classList.remove("hidden");
    }
    function clear() { active = false; beeps = []; $("fire").classList.add("hidden"); }
    return { start, raise, clear, get active() { return active; } };
  })();
  $("fireIcon").innerHTML = ic("bell");

  /* ---------- emergency ---------- */
  let sosHidden = null;
  $("sos").addEventListener("click", () => { $("sosAsk").classList.remove("hidden"); $("sosNo").focus(); });
  $("sosNo").addEventListener("click", () => { $("sosAsk").classList.add("hidden"); $("sos").focus(); });
  $("sosYes").addEventListener("click", async () => {
    $("sosAsk").classList.add("hidden");
    try { const em = await api("POST", "/emergency", { confirm: true }); if (S) S.emergency = em; sosHidden = null; renderEmergency(); }
    catch (e) { fail(e); }
  });
  $("sosHide").addEventListener("click", () => { sosHidden = S && S.emergency && S.emergency.id; renderEmergency(); });
  function renderEmergency() {
    const em = S && S.emergency;
    const at = em ? hhmm(parseLocal(em.created_at)) : "";
    $("sosOpen").classList.toggle("hidden", !em || sosHidden === em.id);
    $("sosBanner").classList.toggle("hidden", !em || sosHidden !== em.id);
    if (em) { $("sosOpenText").textContent = t("sos_open_text", { t: at }); $("sosBanner").innerHTML = ic("phone") + t("sos_banner", { t: at }); }
  }

  /* ---------- static text + language ---------- */
  function applyText() {
    document.documentElement.lang = lang;
    $("lang").textContent = t("lang_btn"); $("lang").setAttribute("aria-label", t("lang_aria"));
    $("sos").innerHTML = ic("alert") + t("sos"); $("sos").setAttribute("aria-label", t("sos_aria"));
    $("stateLabel").textContent = t("state_label");
    $("ear").setAttribute("aria-label", t("ear")); $("ear").title = t("ear");
    document.querySelectorAll("[data-back]").forEach((b) => { if (!b.dataset.t) b.innerHTML = ic("left") + t("back"); });
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
    $("shoot").innerHTML = ic("camera") + t("shoot");
    $("retake").textContent = t("retake");
    $("bStart").innerHTML = t("start_break") + ic("arrow");
    $("bMore").textContent = t("more5"); $("bBack").innerHTML = ic("check") + t("im_back");
    $("bDown").setAttribute("aria-label", t("minus")); $("bUp").setAttribute("aria-label", t("plus"));
    $("volDown").setAttribute("aria-label", t("vol_down")); $("volUp").setAttribute("aria-label", t("vol_up"));
    $("sosAskKicker").innerHTML = ic("alert") + t("sos_kicker"); $("sosOpenKicker").innerHTML = ic("phone") + t("sos_open_kicker");
    $("waterDrop").innerHTML = ic("drop");
    clock(); renderTiles(); renderQuiet(); renderSound(); renderBreak(); studyTick();
    if (S) render();
  }
  $("lang").addEventListener("click", () => {
    lang = lang === "en" ? "de" : "en";
    try { localStorage.setItem("roomv-lang", lang); } catch {}
    applyText();
  });

  /* ---------- keyboard ---------- */
  addEventListener("keydown", (e) => {
    if (!$("sosAsk").classList.contains("hidden")) { if (e.key === "Escape") $("sosNo").click(); return; }
    if (e.key === "Escape" && openSheet) closeSheet();
    if (DEMO && (e.key === "w" || e.key === "W")) showWater(15);
    if (DEMO && (e.key === "f" || e.key === "F")) { Alarm.raise(); setTimeout(() => Alarm.clear(), 15000); }
  });

  /* ---------- back to the start after 90 s without a touch ---------- */
  let lastTouch = Date.now();
  ["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => { lastTouch = Date.now(); }, true));
  setInterval(() => {
    if (Date.now() - lastTouch < IDLE_MS || countdownT || !$("sosAsk").classList.contains("hidden")) return;
    if (openSheet) closeSheet();
    lastTouch = Date.now();
  }, 5000);

  /* ---------- go ---------- */
  applyText();
  poll(); setInterval(poll, 1500);
  Alarm.start();
  window.roomDisplay = { showWater, Alarm };   // for demos and tests
})();
</script>
</body>
</html>

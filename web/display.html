<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room display</title>
<!--
  The board room's touch display (app/display.py opens it as a small window: /display.html?room=Z.1.04&token=...).
  Laid out for the Infineon E84 kit's 4.3" 800x480 panel and scaled to whatever window it gets.
  One big swipeable card per feature (fewer, larger touch targets), arrows + dots + keyboard as well as swiping.
  API: docs/PLAN.md, "Room display". The selfie uses this computer's webcam; without one, the board camera's frame.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<style>
  :root {
    --bg: #0b0f14; --surface: #161c24; --surface-2: #212a35; --line: #3a4656;
    --text: #ffffff; --muted: #b9c4d0; --focus: #ffd54a;
    --free: #3ddc84; --shared: #ffb020; --full: #ff6b6b; --ghost: #b69cff; --closed: #9aa7b6;
    --accent: #6ea8ff; --red: #e5383b; --red-ink: #ffffff; --amber: #ffb020;
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Instrument Sans", system-ui, "Segoe UI", sans-serif; color: var(--text); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .hidden { display: none !important; }
  svg.i { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* fixed 800x480 screen, scaled to fit the window */
  #screen {
    position: absolute; left: 0; top: 0; width: 800px; height: 480px; transform-origin: 0 0;
    background: var(--bg); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: pan-x;
  }

  /* top bar */
  .bar { height: 76px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 20px; border-bottom: 2px solid var(--surface-2); }
  .room { flex: 1; min-width: 0; }
  .room b { display: block; font-size: 26px; line-height: 1.1; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .status .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--closed); flex: none; }
  .clock { font-size: 22px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .langbtn { min-width: 64px; height: 56px; border-radius: 14px; background: var(--surface-2); font-size: 18px; font-weight: 700; }
  .sos {
    height: 56px; min-width: 118px; padding: 0 18px; border-radius: 14px; background: var(--red); color: var(--red-ink);
    font-size: 22px; font-weight: 800; letter-spacing: .04em; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 0 0 3px #ff9a9b55;
  }

  /* home: carousel */
  #home { position: absolute; top: 76px; left: 0; right: 0; bottom: 0; }
  .track {
    position: absolute; left: 0; right: 0; top: 18px; height: 318px;
    display: flex; gap: 24px; padding: 0 120px; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; scroll-behavior: smooth; overscroll-behavior-x: contain;
  }
  .track::-webkit-scrollbar { display: none; }
  .track.dragging { scroll-snap-type: none; scroll-behavior: auto; cursor: grabbing; }
  .card {
    flex: 0 0 560px; height: 318px; scroll-snap-align: center; border-radius: var(--radius);
    background: var(--surface); border: 2px solid var(--line); padding: 26px 30px; text-align: left;
    display: flex; flex-direction: column; gap: 10px; position: relative; transition: transform .25s, opacity .25s;
  }
  .card:not(.current) { opacity: .55; transform: scale(.94); }
  .card .icon { width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center; font-size: 42px; }
  .card h2 { margin: 6px 0 0; font-size: 38px; line-height: 1.1; }
  .card p { margin: 0; font-size: 21px; color: var(--muted); line-height: 1.35; }
  .card .cta {
    margin-top: auto; align-self: stretch; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    gap: 10px; font-size: 24px; font-weight: 700; color: #0b0f14;
  }
  .nav {
    position: absolute; top: 141px; width: 72px; height: 72px; border-radius: 50%; background: var(--surface-2);
    border: 2px solid var(--line); display: grid; place-items: center; font-size: 34px; z-index: 2;
  }
  .nav.prev { left: 22px; } .nav.next { right: 22px; }
  .nav:disabled { opacity: .25; cursor: default; }
  .dots { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 10px; }
  .dots button { width: 48px; height: 36px; display: grid; place-items: center; }
  .dots button span { width: 14px; height: 14px; border-radius: 50%; background: var(--line); transition: width .2s; }
  .dots button[aria-current="true"] span { width: 34px; border-radius: 7px; background: var(--text); }
  .hint { position: absolute; bottom: 52px; left: 0; right: 0; text-align: center; font-size: 15px; color: var(--muted); }

  /* feature sheets */
  .sheet { position: absolute; top: 76px; left: 0; right: 0; bottom: 0; background: var(--bg); padding: 14px 22px 18px; display: flex; flex-direction: column; }
  .sheet-head { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .back { height: 60px; padding: 0 22px 0 14px; border-radius: 16px; background: var(--surface-2); font-size: 22px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .back svg { font-size: 30px; }
  .sheet-head h2 { margin: 0; font-size: 32px; }
  .sheet-body { flex: 1; min-height: 0; display: flex; gap: 26px; align-items: center; }
  .big { height: 84px; border-radius: 18px; font-size: 28px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 0 26px; }
  .primary { background: var(--accent); color: #0b0f14; }
  .secondary { background: var(--surface-2); border: 2px solid var(--line); }
  .lead { font-size: 24px; line-height: 1.35; margin: 0; }
  .muted { color: var(--muted); }

  .qr { background: #fff; border-radius: 18px; padding: 14px; flex: none; display: grid; place-items: center; }
  .qr img, .qr svg { display: block; width: 100%; height: 100%; }

  /* sounds */
  .sounds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; }
  .snd { height: 104px; border-radius: 18px; background: var(--surface); border: 3px solid var(--line); font-size: 22px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .snd svg { font-size: 32px; }
  .snd[aria-pressed="true"] { border-color: var(--free); background: #123222; }
  .snd small { font-size: 15px; font-weight: 600; color: var(--free); }
  .volrow { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  .round { width: 72px; height: 72px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--line); font-size: 36px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .meter { flex: 1; height: 22px; border-radius: 11px; background: var(--surface-2); overflow: hidden; border: 2px solid var(--line); }
  .meter i { display: block; height: 100%; background: var(--free); }
  .volval { width: 92px; font-size: 26px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

  /* selfie */
  .cam { width: 420px; height: 315px; border-radius: 18px; background: #000; position: relative; overflow: hidden; flex: none; border: 2px solid var(--line); }
  .cam video, .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cam video { transform: scaleX(-1); }
  .cam .count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 150px; font-weight: 800; text-shadow: 0 4px 30px #000; }
  .cam .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .cam .flash.go { opacity: 1; transition: none; }
  .cam .camnote { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; font-size: 20px; color: var(--muted); }
  .col { flex: 1; display: flex; flex-direction: column; gap: 14px; justify-content: center; }

  /* break */
  .stepper { display: flex; align-items: center; gap: 22px; }
  .minutes { font-size: 76px; font-weight: 800; color: var(--amber); width: 260px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
  .minutes small { font-size: 30px; font-weight: 700; }
  .chips { display: flex; gap: 12px; }
  .chip { height: 60px; min-width: 88px; border-radius: 14px; background: var(--surface-2); border: 2px solid var(--line); font-size: 22px; font-weight: 700; }
  .chip[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
  .left { font-size: 112px; font-weight: 800; color: var(--amber); font-variant-numeric: tabular-nums; line-height: 1; }

  /* emergency */
  .modal { position: absolute; inset: 0; background: rgb(0 0 0 / 82%); display: grid; place-items: center; z-index: 10; }
  .mcard { width: 640px; background: var(--surface); border: 3px solid var(--red); border-radius: 24px; padding: 28px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .mcard .warn { font-size: 64px; color: var(--red); line-height: 1; }
  .mcard h2 { margin: 0; font-size: 34px; }
  .mcard .row { display: flex; gap: 18px; width: 100%; margin-top: 6px; }
  .mcard .row .big { flex: 1; }
  .danger { background: var(--red); color: var(--red-ink); }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); opacity: .75; } }
  .banner { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 22px; font-weight: 700; z-index: 5; }

  .toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 700px; background: #fff; color: #0b0f14; font-size: 21px; font-weight: 600; padding: 14px 22px; border-radius: 16px; z-index: 20; box-shadow: 0 10px 30px #0008; text-align: center; }
  .offline { position: absolute; left: 0; right: 0; top: 76px; background: var(--amber); color: #0b0f14; font-size: 18px; font-weight: 700; text-align: center; padding: 6px; z-index: 6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div id="screen">
  <header class="bar">
    <div class="room"><b id="label">Room</b><span class="status" id="status"><span class="dot"></span><span id="statusText">…</span></span></div>
    <span class="clock" id="clock" aria-hidden="true">--:--</span>
    <button class="langbtn" id="lang"></button>
    <button class="sos" id="sos"></button>
  </header>

  <div class="offline hidden" id="offline" role="alert"></div>

  <main id="home">
    <button class="nav prev" id="prev"></button>
    <div class="track" id="track" role="group" aria-roledescription="carousel"></div>
    <button class="nav next" id="next"></button>
    <div class="hint" id="hint"></div>
    <div class="dots" id="dots" role="tablist"></div>
  </main>

  <!-- 1. book -->
  <section class="sheet hidden" id="sheet-book" aria-labelledby="h-book">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-book" data-t="book_title"></h2></div>
    <div class="sheet-body">
      <div class="qr" style="width:300px;height:300px"><img id="bookQr" alt=""></div>
      <div class="col">
        <p class="lead" data-t="book_lead"></p>
        <p class="lead muted" id="bookNow"></p>
        <p class="muted" style="font-size:17px;word-break:break-all;margin:0" id="bookUrl"></p>
      </div>
    </div>
  </section>

  <!-- 2. soundscapes -->
  <section class="sheet hidden" id="sheet-sound" aria-labelledby="h-sound">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-sound" data-t="sound_title"></h2></div>
    <div style="flex:1">
      <div class="sounds" id="sounds"></div>
      <div class="volrow">
        <button class="round" id="volDown">−</button>
        <div class="meter" aria-hidden="true"><i id="volBar"></i></div>
        <button class="round" id="volUp">+</button>
        <span class="volval" id="volVal" aria-live="polite"></span>
      </div>
    </div>
  </section>

  <!-- 3. selfie -->
  <section class="sheet hidden" id="sheet-selfie" aria-labelledby="h-selfie">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-selfie" data-t="selfie_title"></h2></div>
    <div class="sheet-body">
      <div class="cam" id="cam">
        <video id="video" autoplay playsinline muted></video>
        <img id="shot" class="hidden" alt="">
        <div class="camnote hidden" id="camNote"></div>
        <div class="count hidden" id="count" aria-live="assertive"></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="col" id="selfieCtrl">
        <p class="lead" data-t="selfie_lead"></p>
        <button class="big primary" id="shoot"></button>
      </div>
      <div class="col hidden" id="selfieDone" style="align-items:center;text-align:center;gap:10px">
        <div class="qr" style="width:164px;height:164px;padding:10px" id="selfieQr"></div>
        <p class="lead" style="font-size:18px" id="selfieExp"></p>
        <div style="display:flex;gap:14px;width:100%">
          <button class="big secondary" style="flex:1;height:64px;font-size:24px" id="retake"></button>
          <button class="big primary" style="flex:1;height:64px;font-size:24px" data-back data-t="done"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. break -->
  <section class="sheet hidden" id="sheet-break" aria-labelledby="h-break">
    <div class="sheet-head"><button class="back" data-back></button><h2 id="h-break" data-t="break_title"></h2></div>
    <div class="sheet-body" id="breakSetup" style="flex-direction:column;align-items:stretch;gap:16px">
      <p class="lead muted" style="font-size:20px" data-t="break_lead"></p>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="stepper">
          <button class="round" id="bDown">−</button>
          <div class="minutes" id="bMin" aria-live="polite"></div>
          <button class="round" id="bUp">+</button>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <button class="big" style="background:var(--amber);color:#0b0f14" id="bStart"></button>
    </div>
    <div class="sheet-body hidden" id="breakActive" style="flex-direction:column;justify-content:center;gap:12px;text-align:center">
      <p class="lead muted" data-t="break_held"></p>
      <div class="left" id="bLeft" role="timer"></div>
      <p class="lead" id="bUntil"></p>
      <div style="display:flex;gap:16px;justify-content:center">
        <button class="big secondary" style="min-width:200px" id="bMore"></button>
        <button class="big" style="min-width:260px;background:var(--free);color:#0b0f14" id="bBack"></button>
      </div>
    </div>
  </section>

  <!-- emergency -->
  <div class="modal hidden" id="sosAsk" role="alertdialog" aria-modal="true" aria-labelledby="sosAskTitle">
    <div class="mcard">
      <div class="warn" id="sosAskIcon"></div>
      <h2 id="sosAskTitle" data-t="sos_ask"></h2>
      <p class="lead muted" style="font-size:21px" data-t="sos_ask_lead"></p>
      <div class="row">
        <button class="big secondary" id="sosNo" data-t="cancel"></button>
        <button class="big danger" id="sosYes" data-t="sos_yes"></button>
      </div>
    </div>
  </div>
  <div class="modal hidden" id="sosOpen" role="alertdialog" aria-modal="true" aria-labelledby="sosOpenTitle">
    <div class="mcard">
      <div class="warn pulse" id="sosOpenIcon"></div>
      <h2 id="sosOpenTitle" data-t="sos_open"></h2>
      <p class="lead" id="sosOpenText"></p>
      <div class="row">
        <button class="big secondary" id="sosHide" data-t="sos_hide"></button>
        <button class="big danger" id="sosEnd" data-t="sos_end"></button>
      </div>
    </div>
  </div>
  <div class="banner hidden" id="sosBanner" role="alert"></div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
</div>

<script>

  const ROOM = params.get("room") || "Z.1.04";

  const API = `/api/display/${encodeURIComponent(ROOM)}`;

  /* ---------- 2. soundscapes (synthesised in the page: no sound files) ---------- */
  const Synth = (() => {
    let ctx, master, nodes = [], timers = [], playing = "off";

      let last = 0, b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (type === "white") d[i] = w * 0.5;
        else if (type === "brown") { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }

      tm.id = setTimeout(tick, Math.random() * min); timers.push(tm);

      const o = ctx.createOscillator(), g = ctx.createGain(), now = ctx.currentTime, base = 2200 + Math.random() * 1800, n = 2 + Math.floor(Math.random() * 3);
      o.frequency.setValueAtTime(base, now);

      ocean() { const n = noise("brown", "lowpass", 600, 0.7, 0.35); lfo(n.g.gain, 0.08, 0.3); lfo(n.f.frequency, 0.08, 350); },
      forest() { noise("pink", "bandpass", 1400, 0.6, 0.3); noise("brown", "lowpass", 400, 0.7, 0.25); every(700, 2600, chirp); },
      cafe() { const n = noise("brown", "bandpass", 420, 1.1, 0.5); lfo(n.g.gain, 0.6, 0.12); noise("pink", "bandpass", 900, 2, 0.06); every(1800, 5000, clink); },

  [5, 10, 15, 20, 30].forEach((m) => {
    const b = document.createElement("button"); b.className = "chip"; b.dataset.m = m;
    b.addEventListener("click", () => { breakMinutes = m; renderBreak(); });
    $("chips").appendChild(b);
  });
  $("bDown").addEventListener("click", () => { breakMinutes = Math.max(BREAK_MIN, breakMinutes - BREAK_STEP); renderBreak(); });
  $("bUp").addEventListener("click", () => { breakMinutes = Math.min(BREAK_MAX, breakMinutes + BREAK_STEP); renderBreak(); });
  async function startBreak(minutes) {
    try { const r = await api("POST", "/break", { minutes }); if (S) S.break_until = r.break_until; render(); }
    catch (e) { fail(e); }
  }
  $("bStart").addEventListener("click", () => startBreak(breakMinutes));
  $("bMore").addEventListener("click", () => {
    const brk = parseLocal(S && S.break_until); if (!brk) return;
    startBreak(Math.min(BREAK_MAX, Math.ceil((brk - new Date()) / 60000) + 5));
  });
  $("bBack").addEventListener("click", async () => {
    try { await api("DELETE", "/break"); if (S) S.break_until = null; render(); } catch (e) { fail(e); }
  });
  function renderBreak() {
    $("bMin").innerHTML = `${breakMinutes} <small>${t("min")}</small>`;
    [...$("chips").children].forEach((c) => { c.textContent = `${c.dataset.m}`; c.setAttribute("aria-pressed", +c.dataset.m === breakMinutes ? "true" : "false"); c.setAttribute("aria-label", `${c.dataset.m} ${t("min")}`); });
    $("bDown").disabled = breakMinutes <= BREAK_MIN; $("bUp").disabled = breakMinutes >= BREAK_MAX;
    const brk = parseLocal(S && S.break_until), on = brk && brk > new Date();
    $("breakSetup").classList.toggle("hidden", !!on); $("breakActive").classList.toggle("hidden", !on);
    if (on) {
      const left = Math.max(0, Math.round((brk - new Date()) / 1000));
      $("bLeft").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
      $("bUntil").textContent = t("back_by", { t: hhmm(brk) });
      $("bMore").disabled = Math.ceil(left / 60) + 5 > BREAK_MAX;
    }
  }
  setInterval(() => { if (openSheet === "break") renderBreak(); }, 1000);

  /* ---------- emergency ---------- */
  let sosHidden = null;   // id of the emergency whose big message was hidden
  $("sos").addEventListener("click", () => { $("sosAsk").classList.remove("hidden"); $("sosNo").focus(); });
  $("sosNo").addEventListener("click", () => { $("sosAsk").classList.add("hidden"); $("sos").focus(); });
  $("sosYes").addEventListener("click", async () => {
    $("sosAsk").classList.add("hidden");
    try {
      const em = await api("POST", "/emergency", { confirm: true });
      if (S) S.emergency = em; sosHidden = null; renderEmergency();
    } catch (e) { fail(e); }
  });
  $("sosHide").addEventListener("click", () => { sosHidden = S && S.emergency && S.emergency.id; renderEmergency(); });
  $("sosEnd").addEventListener("click", async () => {
    try {
      await api("DELETE", "/emergency");
      if (S) S.emergency = null; renderEmergency(); $("sos").focus();
    } catch (e) { fail(e); }
  });
  // the simulated call: "Calling the police (133)…" for a few seconds, then "Police called"
  const CALL_MS = 4000;
  setInterval(() => { if (S && S.emergency && !sosCalled) renderEmergency(); }, 500);
  let sosCalled = false;
  function renderEmergency() {
    const em = S && S.emergency;
    const at = em ? hhmm(parseLocal(em.created_at)) : "";
    sosCalled = !em || Date.now() - parseLocal(em.created_at) >= CALL_MS;
    $("sosOpen").classList.toggle("hidden", !em || sosHidden === em.id);
    $("sosBanner").classList.toggle("hidden", !em || sosHidden !== em.id);
    if (em) {
      $("sosOpenTitle").textContent = t(sosCalled ? "sos_open" : "sos_calling");
      $("sosOpenText").textContent = sosCalled ? t("sos_open_text", { t: at }) : t("sos_calling_text");
      $("sosHide").disabled = $("sosEnd").disabled = !sosCalled;
      $("sosBanner").innerHTML = ic("phone") + t("sos_banner", { t: at });
    }
  }

  /* ---------- static text + language ---------- */
  function applyText() {
    document.documentElement.lang = lang;
    $("lang").textContent = t("lang_btn"); $("lang").setAttribute("aria-label", t("lang_aria"));
    $("sos").innerHTML = ic("alert") + t("sos"); $("sos").setAttribute("aria-label", t("sos_aria"));
    $("prev").innerHTML = ic("left"); $("prev").setAttribute("aria-label", t("prev"));
    $("next").innerHTML = ic("right"); $("next").setAttribute("aria-label", t("next"));
    $("hint").textContent = t("hint");
    track.setAttribute("aria-label", S ? S.label : ROOM);
    document.querySelectorAll("[data-back]").forEach((b) => { if (!b.dataset.t) b.innerHTML = ic("left") + t("back"); });
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
    $("shoot").innerHTML = ic("camera") + t("shoot");
    $("retake").textContent = t("retake");
    $("bStart").innerHTML = ic("coffee") + t("start_break");
    $("bMore").textContent = t("more5"); $("bBack").innerHTML = ic("check") + t("im_back");
    $("bDown").setAttribute("aria-label", t("minus")); $("bUp").setAttribute("aria-label", t("plus"));
    $("volDown").setAttribute("aria-label", t("vol_down")); $("volUp").setAttribute("aria-label", t("vol_up"));
    $("sosAskIcon").innerHTML = ic("alert"); $("sosOpenIcon").innerHTML = ic("phone");
    renderCards(); renderSound(); renderBreak();
    if (S) render();
  }
  $("lang").addEventListener("click", () => {
    lang = lang === "en" ? "de" : "en";
    try { localStorage.setItem("roomv-lang", lang); } catch {}
    applyText();
  });

  /* ---------- keyboard ---------- */
  addEventListener("keydown", (e) => {
    if (!$("sosAsk").classList.contains("hidden")) { if (e.key === "Escape") $("sosNo").click(); return; }
    if (openSheet) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") goTo(current + 1);
    else if (e.key === "ArrowLeft") goTo(current - 1);
  });

  /* ---------- back to the start after 90 s without a touch ---------- */
  let lastTouch = Date.now();
  ["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => { lastTouch = Date.now(); }, true));
  setInterval(() => {
    if (Date.now() - lastTouch < IDLE_MS || countdownT || !$("sosAsk").classList.contains("hidden")) return;
    if (openSheet) closeSheet();
    if (current !== 0) goTo(0);
    lastTouch = Date.now();
  }, 5000);

  /* ---------- go ---------- */
  applyText();
  goTo(0, false);
  poll(); setInterval(poll, 1500);
})();
</script>
</body>
</html>
